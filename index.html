<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WiseSpend — Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   WiseSpend 2.0 — premium minimalist fintech dashboard
   Black + lime, with the champagne gold of 1.x kept as a
   secondary "legacy" accent for savings and the brand mark.
   ============================================================ */
:root{
  /* background */
  --bg:#08080A;
  --bg-soft:#0B0B0E;
  /* surfaces */
  --surface:#101014;
  --surface-2:#15151A;
  --surface-3:#1B1B21;
  /* borders */
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.14);
  --line-faint:rgba(255,255,255,.05);
  /* type */
  --text:#F4F3EE;
  --text-2:#D6D5CE;
  --muted:#8B8A93;
  --faint:#65646D;
  /* accents */
  --lime:#CDEF6E;
  --lime-deep:#A9CE3F;
  --jade:#79E2AF;
  --coral:#FF8F7B;
  --lilac:#BCA9FF;
  --amber:#F5CE73;
  --sky:#8FCDF5;
  --rose:#F5A8C0;
  --gold:#E8D3A9;
  --gold-deep:#C9A96A;
  --on-lime:#0A0A0B;
  /* active accent (switchable) */
  --accent:var(--lime);
  --accent-deep:var(--lime-deep);
  --accent-ink:var(--on-lime);
  --accent-soft:rgba(205,239,110,.12);
  --accent-glow:rgba(205,239,110,.45);
  /* semantics */
  --up:var(--jade);
  --down:var(--coral);
  --move:var(--lilac);
  /* shape + type */
  --r-xl:26px;
  --r-lg:20px;
  --r:16px;
  --r-sm:11px;
  --font-display:"Space Grotesk","Inter",system-ui,sans-serif;
  --font-body:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html[data-accent="gold"]{
  --accent:var(--gold);
  --accent-deep:var(--gold-deep);
  --accent-ink:var(--on-lime);
  --accent-soft:rgba(232,211,169,.12);
  --accent-glow:rgba(232,211,169,.4);
}
html[data-accent="jade"]{
  --accent:var(--jade);
  --accent-deep:#4FC68C;
  --accent-ink:#04120C;
  --accent-soft:rgba(121,226,175,.12);
  --accent-glow:rgba(121,226,175,.4);
}
html[data-theme="light"]{
  --bg:#F4F3EF;
  --bg-soft:#EDECE6;
  --surface:#FFFFFF;
  --surface-2:#F7F6F1;
  --surface-3:#EFEEE8;
  --line:rgba(15,15,20,.09);
  --line-strong:rgba(15,15,20,.16);
  --line-faint:rgba(15,15,20,.06);
  --text:#121216;
  --text-2:#2C2C33;
  --muted:#6B6B74;
  --faint:#96969E;
  --up:#1E8F63;
  --down:#C95A45;
  --move:#6A55C9;
  --accent-ink:#0A0A0B;
  color-scheme:light;
}
html[data-theme="light"][data-accent="lime"]{--accent-soft:rgba(169,206,63,.16);--accent:#C2E45C}
html[data-theme="light"][data-accent="gold"]{--accent-soft:rgba(201,169,106,.18);--accent:#DCC493}
html[data-theme="light"][data-accent="jade"]{--accent-soft:rgba(121,226,175,.2);--accent:#5FD3A0}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:400 14px/1.56 var(--font-body);
  letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(820px 460px at 84% -10%, var(--accent-soft), transparent 62%),
    radial-gradient(620px 480px at -8% 104%, rgba(232,211,169,.05), transparent 64%),
    radial-gradient(700px 420px at 46% 118%, rgba(121,226,175,.035), transparent 70%);
}
html[data-theme="light"] body::before{
  background:
    radial-gradient(820px 460px at 84% -10%, rgba(169,206,63,.12), transparent 62%),
    radial-gradient(620px 480px at -8% 104%, rgba(201,169,106,.12), transparent 64%);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.num,.bal,.v,.amt{font-variant-numeric:tabular-nums}

/* ---------------- shell ---------------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;
  padding:26px 18px 22px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 42%);
}
html[data-theme="light"] .rail{background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 42%)}
.brand{display:flex;align-items:center;gap:11px;padding:0 4px}
.mark{
  width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--lime) 0%,var(--gold) 78%);
  color:#0A0A0B;font:700 15px/1 var(--font-display);letter-spacing:-.03em;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 10px 24px -12px rgba(205,239,110,.55);
}
.brand .word{display:flex;align-items:center;gap:6px;
  font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.015em}
.brand .tag{
  font-size:9px;font-weight:600;letter-spacing:.06em;padding:2px 5px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)
}
.brand .sub{display:block;margin-top:2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.nav .group{
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  padding:0 12px;margin:2px 0 6px;
}
.nav button{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px 10px 14px;border-radius:12px;color:var(--muted);
  font-size:13.5px;font-weight:400;transition:background .16s,color .16s;
}
.nav button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav button:hover{background:var(--surface-2);color:var(--text-2)}
.nav button.on{background:linear-gradient(90deg,var(--accent-soft),rgba(255,255,255,0) 92%);color:var(--text);font-weight:500}
.nav button.on::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:17px;border-radius:99px;
  background:linear-gradient(180deg,var(--lime),var(--gold));
  box-shadow:0 0 12px rgba(232,211,169,.35);
}
.nav button.on svg{color:var(--accent);opacity:1}
.nav .count{
  margin-left:auto;min-width:20px;text-align:center;font-size:10.5px;color:var(--text-2);
  background:var(--surface-3);border:1px solid var(--line);border-radius:99px;padding:1px 6px;
  font-family:var(--font-display)
}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:0 4px}
.rail-foot .divider{height:1px;margin:0 -4px;background:linear-gradient(90deg,rgba(205,239,110,.42),rgba(232,211,169,.34),transparent 92%)}
.foot-block{display:flex;flex-direction:column;gap:8px}
.foot-block .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.sw{display:flex;gap:8px}
.sw button{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1px var(--line-strong) inset;transition:transform .16s,box-shadow .16s}
.sw button:hover{transform:translateY(-1px)}
.sw button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--text)}
.ghost{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:9px 11px;border:1px solid var(--line);border-radius:11px;color:var(--muted);
  font-size:12px;background:var(--surface);transition:border-color .16s,color .16s;
}
.ghost:hover{color:var(--text);border-color:var(--line-strong)}
.ghost svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.currency{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.currency b{font-family:var(--font-display);color:var(--text-2);font-weight:500;letter-spacing:0}
.version{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:11px;
  border-top:1px solid var(--line-faint);font-size:10.5px;color:var(--faint);letter-spacing:.02em;
}
.version b{font-family:var(--font-display);font-weight:500;color:var(--gold);letter-spacing:0}

/* ---------------- recovered-from-Sable banner ---------------- */
.banner{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 14px 12px 16px;
  border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:var(--r);
  background:linear-gradient(90deg,rgba(232,211,169,.09),rgba(232,211,169,.02) 60%,transparent);
}
.banner .ico{color:var(--gold);font-size:13px;line-height:1}
.banner .body{flex:1;min-width:0;font-size:12.5px;color:var(--text-2)}
.banner .body b{font-family:var(--font-display);font-weight:500;color:var(--text);margin-right:6px}
.banner .body span{color:var(--muted)}
.banner button{
  flex:none;font-size:11.5px;font-weight:500;color:var(--gold);padding:6px 11px;border-radius:9px;
  border:1px solid rgba(232,211,169,.32);background:rgba(232,211,169,.07);transition:background .16s;
}
.banner button:hover{background:rgba(232,211,169,.16)}
@media (max-width:600px){.banner{align-items:flex-start;flex-wrap:wrap}.banner .body{flex:1 1 100%}}

/* ---------------- main ---------------- */
main{min-width:0;width:100%;max-width:1180px;margin:0 auto;padding:34px 40px 110px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px}
.top .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.top h1{
  margin:0;font-family:var(--font-display);font-size:30px;font-weight:600;
  letter-spacing:-.028em;line-height:1.1;color:var(--text);
}
.top .sub{margin-top:7px;font-size:12.5px;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .16s,border-color .16s,transform .16s,box-shadow .16s;
}
.btn:hover{background:var(--surface-3);border-color:var(--line-strong);transform:translateY(-1px)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.btn.pri{
  background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600;
  box-shadow:0 12px 30px -16px var(--accent-glow),0 1px 0 rgba(255,255,255,.28) inset;
}
.btn.pri:hover{filter:brightness(1.04);box-shadow:0 16px 34px -16px var(--accent-glow)}

/* ---------------- hero ---------------- */
.hero{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-xl);
  padding:28px 30px 26px;margin-bottom:14px;
  background:linear-gradient(158deg,rgba(205,239,110,.055),transparent 40%),linear-gradient(180deg,#121217,#0D0D11);
}
html[data-theme="light"] .hero{background:linear-gradient(158deg,rgba(205,239,110,.16),transparent 46%),linear-gradient(180deg,#FFFFFF,#FBFAF6)}
.hero::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,var(--accent),rgba(232,211,169,.85) 42%,transparent 74%);
  opacity:.85;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(620px 260px at 6% -30%,var(--accent-soft),transparent 68%),
             radial-gradient(420px 240px at 96% 118%,rgba(232,211,169,.07),transparent 70%);
}
.lbl{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--faint)}
.hero .bal{
  position:relative;z-index:1;margin:10px 0 26px;
  font-family:var(--font-display);font-size:58px;font-weight:600;
  line-height:1.02;letter-spacing:-.035em;
}
.hero .bal em{font-style:normal;font-size:.44em;font-weight:500;color:var(--gold);margin-right:8px;vertical-align:.12em;letter-spacing:0}
.kpis{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding-top:20px;border-top:1px solid var(--line)}
.kpi{padding-right:18px}
.kpi + .kpi{border-left:1px solid var(--line);padding-left:20px}
.kpi .k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.kpi .v{margin-top:5px;font-family:var(--font-display);font-size:20px;font-weight:500;letter-spacing:-.02em}
.up{color:var(--up)}
.down{color:var(--down)}
.gold{color:var(--gold)}

/* ---------------- sections + cards ---------------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 2px 13px}
.sec h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.sec .link{font-size:12px;color:var(--muted);transition:color .16s}
.sec .link:hover{color:var(--accent)}
.grid{display:grid;gap:12px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card.flat{padding:6px 20px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-head .t{font-family:var(--font-display);font-size:14px;font-weight:500;letter-spacing:-.01em}
.card-head .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.cols{display:grid;grid-template-columns:1.08fr .92fr;gap:12px;align-items:start}

/* ---------------- accounts ---------------- */
.acct{
  position:relative;overflow:hidden;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);padding:17px 18px 16px;
  background:linear-gradient(168deg,#121217,#0E0E12);
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
html[data-theme="light"] .acct{background:linear-gradient(168deg,#FFFFFF,#FAF9F5)}
.acct:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 22px 44px -32px #000}
.acct::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(240px 150px at 100% -10%,var(--glow,rgba(255,255,255,.06)),transparent 72%);
}
.acct .bank{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.acct .dot{width:7px;height:7px;border-radius:50%;flex:none}
.acct .name{font-size:13.5px;font-weight:500;margin:3px 0 22px;color:var(--text-2)}
.acct .amt{position:relative;z-index:1;font-family:var(--font-display);font-size:25px;font-weight:500;letter-spacing:-.03em;line-height:1}
.acct .amt em{font-style:normal;font-size:.68em;font-weight:500;color:var(--gold);margin-right:2px;vertical-align:.06em;letter-spacing:0}
.acct-wrap{display:flex;flex-direction:column;gap:5px}
.mini{
  font-size:11px;color:var(--faint);padding:5px 10px;border-radius:8px;align-self:flex-end;
  border:1px solid transparent;transition:color .16s,background .16s,border-color .16s;
}
.mini:hover{color:var(--text);background:var(--surface-2);border-color:var(--line)}
.mini.sure{color:var(--down);border-color:rgba(255,143,123,.35);background:rgba(255,143,123,.1)}

/* ---------------- cash flow ---------------- */
.legend{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-2);
  font-family:var(--font-display);font-size:11.5px;font-weight:500;
}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px}
.flow-col{display:flex;flex-direction:column;align-items:center;gap:9px}
.flow-bars{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:144px;width:100%}
.flow-bars i{width:16px;border-radius:99px;min-height:4px;transition:height .4s ease}
.flow-bars i.in{background:linear-gradient(180deg,var(--lime),var(--lime-deep));box-shadow:0 -6px 18px -10px var(--lime)}
.flow-bars i.out{background:linear-gradient(180deg,rgba(255,143,123,.9),rgba(255,143,123,.18))}
html[data-theme="light"] .flow-bars i.in{background:linear-gradient(180deg,#B9DC4D,#8FB822)}
.flow-col .m{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-family:var(--font-display)}
.flow-col.now .m{color:var(--gold)}
.flow-col.now .m::after{content:"";display:block;width:14px;height:1px;margin:5px auto 0;background:linear-gradient(90deg,var(--lime),var(--gold))}

/* ---------------- bars (categories) ---------------- */
.bars{display:flex;flex-direction:column;gap:15px}
.barrow .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.barrow .head .n{font-size:13px;color:var(--text-2)}
.barrow .head .v{font-family:var(--font-display);font-size:12.5px;color:var(--text);letter-spacing:-.01em}
.track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .4s ease}

/* ---------------- rows ---------------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-faint)}
.row:last-child{border-bottom:0}
.dot-ico{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-size:15px;background:var(--surface-2);border:1px solid var(--line);
}
.row .t{flex:1;min-width:0}
.row .t .a{font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .a .note{color:var(--faint)}
.row .t .b{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.amt{font-family:var(--font-display);font-size:13.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.x{color:var(--faint);font-size:11px;padding:5px 8px;border-radius:8px;transition:color .16s,background .16s;white-space:nowrap}
.x:hover{color:var(--text);background:var(--surface-3)}
.x.sure{color:var(--down);background:rgba(255,143,123,.12)}
.empty{padding:30px 8px;text-align:center;color:var(--faint);font-size:12.5px}

/* ---------------- filters / inputs ---------------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
select,input[type=text],input[type=number],input[type=date]{
  width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--text);font-size:13px;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
select:hover,input:hover{border-color:var(--line-strong);background:var(--surface-3)}
input::placeholder{color:var(--faint)}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters select{width:auto;flex:1;min-width:150px;padding:9px 32px 9px 12px;font-size:12.5px;background:var(--surface)}
select{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 53%,calc(100% - 11px) 53%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;
}
.sumstrip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.sumstrip .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.sumstrip b{font-family:var(--font-display);font-weight:500;color:var(--text-2)}

/* ---------------- modal ---------------- */
#modal{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,4,6,.66);backdrop-filter:blur(8px);
}
#modal.open{display:flex}
.sheet{
  position:relative;width:100%;max-width:478px;max-height:90vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:24px;padding:26px;
  box-shadow:0 50px 100px -46px #000;
}
.sheet::before{
  content:"";position:absolute;top:0;left:26px;right:26px;height:1px;
  background:linear-gradient(90deg,var(--lime),var(--gold) 55%,transparent);opacity:.8;
}
.sheet h3{
  margin:0 0 20px;font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-.02em;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.sheet h3 .esc{color:var(--faint);font-size:11.5px;font-weight:400;font-family:var(--font-body);letter-spacing:0}
.f{margin-bottom:14px}
.f label{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:20px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:12.5px;color:var(--muted);transition:background .16s,color .16s;font-weight:500}
.seg button:hover{color:var(--text-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 6px 16px -10px var(--accent-glow)}
.btns{display:flex;gap:10px;margin-top:22px}
.btns button{
  flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:500;
  background:var(--surface-2);border:1px solid var(--line-strong);
}
.btns button:hover{background:var(--surface-3)}
.btns .pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.btns .pri:hover{filter:brightness(1.04);background:var(--accent)}
.err{color:var(--down);font-size:12px;min-height:16px;margin-top:4px}

/* ---------------- responsive ---------------- */
@media (max-width:1040px){
  .cols{grid-template-columns:1fr}
  .hero .bal{font-size:50px}
}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;gap:12px;
    padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);
    background:rgba(8,8,10,.88);backdrop-filter:blur(14px);overflow-x:auto;
  }
  html[data-theme="light"] .rail{background:rgba(244,243,239,.9)}
  .brand .sub,.brand .word .tag{display:none}
  .nav{flex-direction:row;margin:0;gap:2px}
  .nav .group{display:none}
  .nav button{padding:8px 11px 8px 11px;white-space:nowrap}
  .nav button.on::before{display:none}
  .nav .count{display:none}
  .rail-foot{flex-direction:row;margin:0 0 0 auto;gap:10px;padding:0}
  .rail-foot .divider,.foot-block:first-child,.foot-block .k{display:none}
  .ghost{padding:8px 10px}
  main{padding:24px 18px 96px}
  .hero{padding:24px 22px}
  .kpis{grid-template-columns:1fr 1fr;gap:18px 2px}
  .kpi:nth-child(3){border-left:0;padding-left:0}
  .kpi + .kpi{padding-right:0}
  .top{flex-wrap:wrap;align-items:center}
  .top h1{font-size:25px}
}
@media (max-width:600px){
  .hero .bal{font-size:38px}
  .flow{gap:6px}
  .flow-bars{height:104px}
  .flow-bars i{width:10px}
  .sheet{border-radius:20px;padding:21px}
  .filters select{min-width:0;flex:1 1 46%}
  .btn.pri span{display:none}
  .currency{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">W</div>
      <div>
        <div class="word">WiseSpend <span class="tag">2.0</span></div>
        <span class="sub">Finance tracker</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="divider"></div>
      <div class="foot-block">
        <div class="k">Accent</div>
        <div class="sw" id="sw"></div>
      </div>
      <div class="foot-block">
        <button class="ghost" id="theme">
          <span id="themeLabel">Dark</span>
          <svg viewBox="0 0 24 24"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1 1M18.8 18.8l1 1M3 12h1.5M19.5 12H21M4.2 19.8l1-1M18.8 5.2l1-1"/><circle cx="12" cy="12" r="3.6"/></svg>
        </button>
        <div class="currency"><span>Currency</span><b>INR ₹</b></div>
        <div class="version" id="version">WiseSpend <b>v2.0.1</b></div>
      </div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div>
        <div class="eyebrow" id="eyebrow">WiseSpend</div>
        <h1 id="title">Overview</h1>
        <div class="sub" id="today"></div>
      </div>
      <button class="btn pri" id="fab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New transaction</span>
      </button>
    </div>
    <div id="notice"></div>
    <div id="app"></div>
  </main>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- palette + prefs ---------- */
const P = ['#CDEF6E','#79E2AF','#F5CE73','#8FCDF5','#BCA9FF','#F5A8C0','#FF8F7B','#E8D3A9'];
const ACCENTS = {
  lime:{a:'#CDEF6E', ink:'#0A0A0B', label:'Lime'},
  gold:{a:'#E8D3A9', ink:'#0A0A0B', label:'Gold'},
  jade:{a:'#79E2AF', ink:'#04120C', label:'Jade'}
};
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (n, d) => new Intl.NumberFormat('en-IN',{maximumFractionDigits:d}).format(Math.abs(n || 0));
const sgn = n => (n || 0) < 0 ? '−' : '';
const fmt  = n => `${sgn(n)}₹${num(n, 2)}`;
const fmt2 = n => `${sgn(n)}₹${num(n, 0)}`;
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fdate = d => new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const seed = () => ({
  accounts:[{id:'a1',name:'Cash',bank:'Wallet',open:0,color:P[1]}],
  cats:[['Food','🍜','expense',P[2]],['Transport','🚌','expense',P[3]],['Rent','🏠','expense',P[4]],['Shopping','🛍️','expense',P[5]],['Salary','💼','income',P[1]],['Freelance','✨','income',P[0]]].map(c=>({id:uid(),name:c[0],emoji:c[1],type:c[2],color:c[3]})),
  tx:[],
  prefs:{theme:'dark',accent:'lime'}
});

/* ---------- state (migrates Sable 1.x data) ---------- */
const KEY = 'wisespend-v2';
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('sable-v1')); } catch(e) {}
S = S || seed();
S.prefs = Object.assign({theme:'dark',accent:'lime'}, S.prefs || {});
if (!ACCENTS[S.prefs.accent]) S.prefs.accent = 'lime';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const VERSION = new URLSearchParams(location.search).get('v') || '2.0.1';

let view = 'home', F = {acc:'', cat:'', type:''}, armed = null, pick = P[0], ttype = 'expense';

const acc = id => S.accounts.find(a => a.id === id);
const cat = id => S.cats.find(c => c.id === id);
const bal = a => S.tx.reduce((b,t) => {
  const v = +t.amount;
  if (t.type === 'income'  && t.acc === a.id) return b + v;
  if (t.type === 'expense' && t.acc === a.id) return b - v;
  if (t.type === 'transfer') { if (t.acc === a.id) b -= v; if (t.to === a.id) b += v; }
  return b;
}, +a.open);
const sorted = l => [...l].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
const tint = (hex, alpha) => {
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(x=>x+x).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
};
const mk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const lastMonths = n => {
  const out = [], now = new Date();
  for (let i = n-1; i >= 0; i--) out.push(new Date(now.getFullYear(), now.getMonth()-i, 1));
  return out;
};

/* ---------- icons ---------- */
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.6 10.4V20h10.8v-9.6"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  wallet:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><path d="M16.5 15h1.5"/></svg>',
  tag:'<svg viewBox="0 0 24 24"><path d="M4 12.4V5.2A1.2 1.2 0 0 1 5.2 4h7.2l7.6 7.6-8.4 8.4L4 12.4Z"/><circle cx="8.4" cy="8.4" r="1.3"/></svg>'
};

/* ---------- prefs ---------- */
function applyPrefs(){
  const p = S.prefs;
  document.documentElement.dataset.theme = p.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.accent = ACCENTS[p.accent] ? p.accent : 'lime';
  const tl = $('#themeLabel'); if (tl) tl.textContent = p.theme === 'light' ? 'Light' : 'Dark';
  const sw = $('#sw');
  if (sw) sw.innerHTML = Object.entries(ACCENTS).map(([k,v]) =>
    `<button data-accent="${k}" class="${p.accent===k?'on':''}" style="background:${v.a}" aria-label="${v.label} accent" title="${v.label}"></button>`).join('');
}

/* ---------- rows ---------- */
function txRow(t){
  const c = cat(t.cat), a = acc(t.acc), to = acc(t.to);
  const title = t.type === 'transfer' ? 'Transfer' : (c ? c.name : 'Uncategorised');
  const where = t.type === 'transfer' ? `${esc(a?.name || '—')} → ${esc(to?.name || '—')}` : esc(a?.name || '—');
  const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '';
  const cls = t.type === 'income' ? 'up' : t.type === 'expense' ? 'down' : '';
  const tintColor = t.type === 'transfer' ? '#BCA9FF' : (c?.color || '#8B8A93');
  const glyph = t.type === 'transfer' ? '⇄' : (c?.emoji || '•');
  return `<div class="row">
    <div class="dot-ico" style="background:${tint(tintColor,.13)};border-color:${tint(tintColor,.24)};color:${tintColor}">${glyph}</div>
    <div class="t"><div class="a">${esc(title)}${t.note?' <span class="note">· '+esc(t.note)+'</span>':''}</div>
      <div class="b">${where} · ${fdate(t.date)}</div></div>
    <div class="amt ${cls}">${sign}${fmt(t.amount)}</div>
    <button class="x ${armed==='t'+t.id?'sure':''}" data-del="t${t.id}" aria-label="Delete transaction">${armed==='t'+t.id?'Sure?':'✕'}</button>
  </div>`;
}

/* ---------- views ---------- */
const TITLES = {home:'Overview', tx:'Transactions', acc:'Accounts', cat:'Categories'};
const EYEBROWS = {home:'Total picture', tx:'Every movement', acc:'Where money sits', cat:'How money is sorted'};

function render(){
  const d = new Date();
  $('#eyebrow').textContent = EYEBROWS[view];
  $('#today').textContent = d.toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long'});
  $('#title').textContent = TITLES[view];
  $('#nav').innerHTML = [['home','Overview','home'],['tx','Transactions','list'],['acc','Accounts','wallet'],['cat','Categories','tag']]
    .map(([v,label,icon]) => `<button data-v="${v}" class="${view===v?'on':''}">${ICON[icon]}<span>${label}</span>${v==='tx'&&S.tx.length?`<span class="count">${S.tx.length}</span>`:''}</button>`).join('');
  $('#notice').innerHTML = noticeHTML();
  $('#app').innerHTML = ({home, tx:txView, acc:accountsView, cat:catsView})[view]();
  applyPrefs();
}

function noticeHTML(){
  const p = S.prefs;
  if (!p.importedAt || p.importedSeen) return '';
  const n = +p.importedCount || 0;
  return `<div class="banner">
    <span class="ico">✦</span>
    <div class="body"><b>Recovered from Sable</b> <span>${n} transaction${n===1?'':'s'}, ${S.accounts.length} account${S.accounts.length===1?'':'s'} and ${S.cats.length} categories carried over.</span></div>
    <button data-dismiss-note>Got it</button>
  </div>`;
}

/* ---------- adopt the Sable 1.x store handed over by main.js ---------- */
function adoptLegacyStore(raw){
  if (!raw) return null;
  let old;
  try { old = JSON.parse(raw); } catch(e) { return null; }
  if (!old || !Array.isArray(old.accounts) || !Array.isArray(old.cats) || !Array.isArray(old.tx)) return null;

  const untouched = !localStorage.getItem(KEY);
  let added = 0;

  if (untouched) {
    S.accounts = old.accounts.map(a => Object.assign({}, a));
    S.cats = old.cats.map(c => Object.assign({}, c));
    S.tx = old.tx.map(t => Object.assign({}, t));
    S.prefs = Object.assign({}, S.prefs, old.prefs || {});
    // 1.x shipped champagne / jade / iris accents; keep the gold one going
    const carried = { champagne: 'gold', iris: 'jade' }[S.prefs.accent] || S.prefs.accent;
    S.prefs.accent = ACCENTS[carried] ? carried : 'lime';
    added = S.tx.length;
  } else {
    // the new store already has entries: merge without duplicating anything
    const accIds = new Set(S.accounts.map(a => a.id));
    const catIds = new Set(S.cats.map(c => c.id));
    const txIds = new Set(S.tx.map(t => t.id));
    old.accounts.forEach(a => { if (a && a.id && !accIds.has(a.id)) { S.accounts.push(a); accIds.add(a.id); } });
    old.cats.forEach(c => { if (c && c.id && !catIds.has(c.id)) { S.cats.push(c); catIds.add(c.id); } });
    old.tx.forEach(t => { if (t && t.id && !txIds.has(t.id)) { S.tx.push(t); txIds.add(t.id); added++; } });
  }

  if (added) {
    S.prefs.importedAt = new Date().toISOString();
    S.prefs.importedCount = added;
    S.prefs.importedSeen = false;
  }
  save();
  if (added) { view = 'home'; }
  render();
  return added;
}
window.__wisespendAdopt = adoptLegacyStore;

function home(){
  const m = todayStr().slice(0,7);
  const mt = S.tx.filter(t => t.date.startsWith(m));
  const inc = mt.filter(t => t.type === 'income').reduce((s,t) => s + +t.amount, 0);
  const exp = mt.filter(t => t.type === 'expense').reduce((s,t) => s + +t.amount, 0);
  const total = S.accounts.reduce((s,a) => s + bal(a), 0);
  const net = inc - exp;

  const spend = {};
  mt.filter(t => t.type === 'expense').forEach(t => {
    const k = t.cat || '';
    spend[k] = (spend[k] || 0) + +t.amount;
  });
  const bars = Object.entries(spend).sort((a,b) => b[1]-a[1]).slice(0,5).map(([id,v]) => {
    const c = cat(id);
    return {name:c ? `${c.emoji} ${c.name}` : 'Uncategorised', color:c?.color || '#8B8A93', v};
  });
  const maxBar = Math.max(1, ...bars.map(b => b.v));

  const flow = lastMonths(6).map(d => {
    const k = mk(d), l = S.tx.filter(t => t.date.startsWith(k));
    return {
      label: d.toLocaleDateString('en-IN',{month:'short'}),
      inc: l.filter(t => t.type === 'income').reduce((s,t) => s + +t.amount, 0),
      exp: l.filter(t => t.type === 'expense').reduce((s,t) => s + +t.amount, 0),
      now: k === m
    };
  });
  const maxFlow = Math.max(1, ...flow.flatMap(f => [f.inc, f.exp]));
  const h = v => v ? Math.max(6, Math.round(v / maxFlow * 100)) : 2;

  return `
  <section class="hero">
    <div class="lbl">Total balance</div>
    <div class="bal">${sgn(total)}<em>₹</em>${num(total, 2)}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">Income · this month</div><div class="v up">+${fmt2(inc)}</div></div>
      <div class="kpi"><div class="k">Spent · this month</div><div class="v down">−${fmt2(exp)}</div></div>
      <div class="kpi"><div class="k">Saved · this month</div><div class="v ${net >= 0 ? 'gold' : 'down'}">${net >= 0 ? '+' : '−'}${fmt2(Math.abs(net))}</div></div>
      <div class="kpi"><div class="k">Across</div><div class="v">${S.accounts.length} account${S.accounts.length===1?'':'s'}</div></div>
    </div>
  </section>

  <div class="sec"><h2>Accounts</h2><button class="link" data-v="acc">See all</button></div>
  <div class="grid g-auto">${S.accounts.map(accCard).join('') || '<div class="card empty">No accounts yet — add one to begin.</div>'}</div>

  <div class="sec"><h2>Money flow · last 6 months</h2>
    <div class="chip ${net>=0?'up':'down'}">${net>=0?'+':'−'}${fmt2(Math.abs(net))} this month</div>
  </div>
  <div class="card">
    <div class="card-head">
      <div><div class="t">In and out</div><div class="s">Income against expenses, month by month</div></div>
      <div class="legend">
        <span><i style="background:var(--lime)"></i>In</span>
        <span><i style="background:var(--coral)"></i>Out</span>
      </div>
    </div>
    <div class="flow">${flow.map(f => `
      <div class="flow-col ${f.now?'now':''}">
        <div class="flow-bars">
          <i class="in" style="height:${h(f.inc)}%" title="Income ${fmt2(f.inc)}"></i>
          <i class="out" style="height:${h(f.exp)}%" title="Expenses ${fmt2(f.exp)}"></i>
        </div>
        <span class="m">${f.label}</span>
      </div>`).join('')}</div>
  </div>

  <div class="sec"><h2>This month</h2><button class="link" data-v="tx">All transactions</button></div>
  <div class="cols">
    <div class="card">
      <div class="card-head">
        <div><div class="t">Spending by category</div><div class="s">${fmt2(exp)} across ${bars.length} categor${bars.length===1?'y':'ies'}</div></div>
        <div class="chip">${inc > 0 ? Math.round(Math.min(100, exp / inc * 100)) + '% of income' : 'No income yet'}</div>
      </div>
      ${bars.length ? `<div class="bars">${bars.map(b => `
        <div class="barrow">
          <div class="head"><span class="n">${esc(b.name)}</span><span class="v">${fmt2(b.v)}</span></div>
          <div class="track"><i style="width:${Math.max(3,(b.v/maxBar*100)).toFixed(1)}%;background:linear-gradient(90deg,${b.color},${tint(b.color,.35)})"></i></div>
        </div>`).join('')}</div>`
      : '<div class="empty">No expenses logged this month.</div>'}
    </div>
    <div class="card flat">
      ${S.tx.length ? sorted(S.tx).slice(0,6).map(txRow).join('') : '<div class="empty">Nothing yet. Add your first transaction.</div>'}
    </div>
  </div>`;
}

const accCard = a => `<button class="acct" data-log="${a.id}" style="--glow:${tint(a.color,.16)}">
  <div class="bank"><span class="dot" style="background:${a.color}"></span>${esc(a.bank)}</div>
  <div class="name">${esc(a.name)}</div>
  <div class="amt">${sgn(bal(a))}<em>₹</em>${num(bal(a), 2)}</div>
</button>`;

function txView(){
  let l = sorted(S.tx).filter(t => (!F.acc || t.acc === F.acc || t.to === F.acc) && (!F.cat || t.cat === F.cat) && (!F.type || t.type === F.type));
  const o = (arr, sel) => arr.map(x => `<option value="${x.id||x[0]}" ${sel===(x.id||x[0])?'selected':''}>${esc(x.name||x[1])}</option>`).join('');
  const sum = l.reduce((s,t) => s + (t.type === 'income' ? +t.amount : t.type === 'expense' ? -+t.amount : 0), 0);
  return `<div class="filters">
    <select data-f="type"><option value="">All types</option>${o([['expense','Expenses'],['income','Income'],['transfer','Transfers']], F.type)}</select>
    <select data-f="acc"><option value="">All accounts</option>${o(S.accounts, F.acc)}</select>
    <select data-f="cat"><option value="">All categories</option>${o(S.cats, F.cat)}</select>
  </div>
  <div class="sumstrip">
    <span class="k">${l.length} transaction${l.length===1?'':'s'}</span>
    <span class="k">Net <b class="${sum>=0?'up':'down'}">${sum>=0?'+':'−'}${fmt2(Math.abs(sum))}</b></span>
  </div>
  <div class="card flat">${l.length ? l.map(txRow).join('') : '<div class="empty">Nothing matches these filters.</div>'}</div>`;
}

function accountsView(){
  return `<div class="sec" style="margin-top:4px"><h2>Your accounts</h2><button class="btn" data-new="acc">+ New account</button></div>
  <div class="grid g-auto">${S.accounts.map(a => `<div class="acct-wrap">${accCard(a)}
    <button class="mini ${armed==='a'+a.id?'sure':''}" data-del="a${a.id}">${armed==='a'+a.id?'Delete account and its transactions?':'Delete'}</button></div>`).join('') || '<div class="card empty">No accounts yet.</div>'}</div>
  <p style="color:var(--faint);font-size:12px;margin-top:20px;max-width:560px">One account per bank, wallet or card. Open an account to see its full log. Balances include the opening balance and every income, expense and transfer.</p>`;
}

function catsView(){
  const group = type => S.cats.filter(c => c.type === type).map(c => {
    const n = S.tx.filter(x => x.cat === c.id).length;
    return `<div class="row">
      <button class="dot-ico" data-clog="${c.id}" style="background:${tint(c.color,.13)};border-color:${tint(c.color,.24)}">${c.emoji}</button>
      <div class="t"><div class="a">${esc(c.name)}</div><div class="b">${n} transaction${n===1?'':'s'}</div></div>
      <button class="x" data-clog="${c.id}">Log</button>
      <button class="x ${armed==='c'+c.id?'sure':''}" data-del="c${c.id}">${armed==='c'+c.id?'Sure?':'✕'}</button>
    </div>`;
  }).join('') || '<div class="empty">None yet.</div>';
  return `<div class="sec" style="margin-top:4px"><h2>Expense categories</h2><button class="btn" data-new="cat">+ New category</button></div>
  <div class="card flat">${group('expense')}</div>
  <div class="sec"><h2>Income categories</h2></div>
  <div class="card flat">${group('income')}</div>`;
}

/* ---------- modals ---------- */
const open = h => { $('#sheet').innerHTML = h; $('#modal').classList.add('open'); };
const close = () => $('#modal').classList.remove('open');
const swatches = () => `<div class="sw" style="gap:9px">${P.map(c => `<button data-c="${c}" class="${c===pick?'on':''}" style="width:24px;height:24px;background:${c}" aria-label="colour"></button>`).join('')}</div>`;

function txModal(){
  if (!S.accounts.length) { accModal(); return; }
  const ac = S.accounts.map(a => `<option value="${a.id}">${esc(a.name)} (${esc(a.bank)})</option>`).join('');
  const cs = S.cats.filter(c => c.type === ttype).map(c => `<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('');
  const tr = ttype === 'transfer';
  open(`<h3>New transaction <span class="esc">esc to close</span></h3>
  <div class="seg">${['expense','income','transfer'].map(t => `<button data-t="${t}" class="${t===ttype?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
  <div class="two">
    <div class="f"><label>Amount (₹)</label><input id="m-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autofocus></div>
    <div class="f"><label>Date</label><input id="m-date" type="date" value="${todayStr()}"></div>
  </div>
  <div class="f"><label>${tr?'From account':'Account'}</label><select id="m-acc">${ac}</select></div>
  ${tr ? `<div class="f"><label>To account</label><select id="m-to">${ac}</select></div>`
       : `<div class="f"><label>Category</label><select id="m-cat">${cs || '<option value="">No categories</option>'}</select></div>`}
  <div class="f"><label>Note (optional)</label><input id="m-note" type="text" maxlength="60" placeholder="e.g. Lunch with team"></div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-save="tx">Save</button></div>`);
  if (tr && S.accounts.length > 1) $('#m-to').selectedIndex = 1;
  setTimeout(() => $('#m-amt')?.focus(), 60);
}

function accModal(){
  pick = P[1];
  open(`<h3>New account <span class="esc">esc to close</span></h3>
  <div class="f"><label>Account name</label><input id="m-name" type="text" maxlength="30" placeholder="e.g. Savings"></div>
  <div class="f"><label>Bank or wallet</label><input id="m-bank" type="text" maxlength="30" placeholder="e.g. HDFC Bank"></div>
  <div class="f"><label>Opening balance (₹)</label><input id="m-open" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
  <div class="f"><label>Accent</label>${swatches()}</div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-save="acc">Save account</button></div>`);
}

function catModal(){
  pick = P[0];
  open(`<h3>New category <span class="esc">esc to close</span></h3>
  <div class="two">
    <div class="f"><label>Name</label><input id="m-name" type="text" maxlength="24" placeholder="e.g. Groceries"></div>
    <div class="f"><label>Emoji</label><input id="m-emoji" type="text" maxlength="4" value="🌿"></div>
  </div>
  <div class="f"><label>Type</label><select id="m-type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
  <div class="f"><label>Accent</label>${swatches()}</div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-save="cat">Save category</button></div>`);
}

function saveForm(k){
  const v = id => ($('#'+id)?.value || '').trim();
  const err = m => { $('#err').textContent = m; };
  if (k === 'tx'){
    const amt = +v('m-amt');
    if (!(amt > 0)) return err('Enter an amount greater than 0.');
    const t = {id:uid(), type:ttype, amount:amt, date:v('m-date') || todayStr(), acc:v('m-acc'), note:v('m-note')};
    if (ttype === 'transfer') { t.to = v('m-to'); if (t.to === t.acc) return err('Pick two different accounts.'); }
    else t.cat = v('m-cat');
    S.tx.push(t);
  }
  if (k === 'acc'){
    if (!v('m-name')) return err('Give the account a name.');
    S.accounts.push({id:uid(), name:v('m-name'), bank:v('m-bank') || 'Bank', open:+v('m-open') || 0, color:pick});
  }
  if (k === 'cat'){
    if (!v('m-name')) return err('Give the category a name.');
    S.cats.push({id:uid(), name:v('m-name'), emoji:v('m-emoji') || '•', type:v('m-type'), color:pick});
  }
  save(); close(); render();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button, #modal');
  if (!b) return;
  const d = b.dataset;
  if (b.id === 'modal') { if (e.target === b) close(); return; }
  if (b.id === 'fab') { ttype = 'expense'; return txModal(); }
  if (b.id === 'theme') { S.prefs.theme = S.prefs.theme === 'light' ? 'dark' : 'light'; save(); applyPrefs(); return; }
  if (d.accent) { S.prefs.accent = d.accent; save(); applyPrefs(); return; }
  if (d.v) { view = d.v; armed = null; if (d.v !== 'tx') F = {acc:'', cat:'', type:''}; return render(); }
  if (d.log) { F = {acc:d.log, cat:'', type:''}; view = 'tx'; armed = null; return render(); }
  if (d.clog) { F = {acc:'', cat:d.clog, type:''}; view = 'tx'; armed = null; return render(); }
  if (d.new) return d.new === 'acc' ? accModal() : catModal();
  if ('close' in d) return close();
  if (d.t) { ttype = d.t; return txModal(); }
  if (d.c) { pick = d.c; document.querySelectorAll('.sw button[data-c]').forEach(x => x.classList.toggle('on', x.dataset.c === pick)); return; }
  if ('dismissNote' in d) { S.prefs.importedSeen = true; save(); render(); return; }
  if (d.save) return saveForm(d.save);
  if (d.del) {
    if (armed !== d.del) { armed = d.del; return render(); }
    const k = d.del[0], id = d.del.slice(1);
    if (k === 't') S.tx = S.tx.filter(t => t.id !== id);
    if (k === 'a') { S.accounts = S.accounts.filter(a => a.id !== id); S.tx = S.tx.filter(t => t.acc !== id && t.to !== id); }
    if (k === 'c') { S.cats = S.cats.filter(c => c.id !== id); S.tx.forEach(t => { if (t.cat === id) t.cat = ''; }); }
    armed = null; save(); render();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.f) { F[e.target.dataset.f] = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  if (e.key === 'Enter' && $('#modal').classList.contains('open')) {
    const s = document.querySelector('#modal [data-save]');
    if (s) saveForm(s.dataset.save);
  }
});

applyPrefs();
const verEl = $('#version');
if (verEl) verEl.innerHTML = `WiseSpend <b>v${esc(VERSION)}</b>`;

/* the Sable 1.x store, staged by main.js and handed over by preload.js */
if (window.wisespendLegacy) {
  try {
    // null means the staged store was unusable, so main.js keeps the check open
    const added = adoptLegacyStore(window.wisespendLegacy);
    if (added !== null && window.wisespendLegacyAdopted) window.wisespendLegacyAdopted();
  } catch (e) { console.error('WiseSpend: legacy import failed', e); }
}

render();
</script>
</body>
</html>
