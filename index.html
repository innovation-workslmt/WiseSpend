<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WiseSpend — Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   WiseSpend 2.0 — premium minimalist fintech dashboard
   Black + lime, with the champagne gold of 1.x kept as a
   secondary "legacy" accent for savings and the brand mark.
   ============================================================ */
:root{
  /* background */
  --bg:#08080A;
  --bg-soft:#0B0B0E;
  /* surfaces */
  --surface:#101014;
  --surface-2:#15151A;
  --surface-3:#1B1B21;
  /* borders */
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.14);
  --line-faint:rgba(255,255,255,.05);
  /* type */
  --text:#F4F3EE;
  --text-2:#D6D5CE;
  --muted:#8B8A93;
  --faint:#65646D;
  /* accents */
  --lime:#CDEF6E;
  --lime-deep:#A9CE3F;
  --jade:#79E2AF;
  --coral:#FF8F7B;
  --lilac:#BCA9FF;
  --amber:#F5CE73;
  --sky:#8FCDF5;
  --rose:#F5A8C0;
  --gold:#E8D3A9;
  --gold-deep:#C9A96A;
  --on-lime:#0A0A0B;
  /* active accent (switchable) */
  --accent:var(--lime);
  --accent-deep:var(--lime-deep);
  --accent-ink:var(--on-lime);
  --accent-soft:rgba(205,239,110,.12);
  --accent-glow:rgba(205,239,110,.45);
  /* semantics */
  --up:var(--jade);
  --down:var(--coral);
  --move:var(--lilac);
  /* shape + type */
  --r-xl:26px;
  --r-lg:20px;
  --r:16px;
  --r-sm:11px;
  --font-display:"Space Grotesk","Inter",system-ui,sans-serif;
  --font-body:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html[data-accent="gold"]{
  --accent:var(--gold);
  --accent-deep:var(--gold-deep);
  --accent-ink:var(--on-lime);
  --accent-soft:rgba(232,211,169,.12);
  --accent-glow:rgba(232,211,169,.4);
}
html[data-accent="jade"]{
  --accent:var(--jade);
  --accent-deep:#4FC68C;
  --accent-ink:#04120C;
  --accent-soft:rgba(121,226,175,.12);
  --accent-glow:rgba(121,226,175,.4);
}
html[data-theme="light"]{
  --bg:#F4F3EF;
  --bg-soft:#EDECE6;
  --surface:#FFFFFF;
  --surface-2:#F7F6F1;
  --surface-3:#EFEEE8;
  --line:rgba(15,15,20,.09);
  --line-strong:rgba(15,15,20,.16);
  --line-faint:rgba(15,15,20,.06);
  --text:#121216;
  --text-2:#2C2C33;
  --muted:#6B6B74;
  --faint:#96969E;
  --up:#1E8F63;
  --down:#C95A45;
  --move:#6A55C9;
  --accent-ink:#0A0A0B;
  color-scheme:light;
}
html[data-theme="light"][data-accent="lime"]{--accent-soft:rgba(169,206,63,.16);--accent:#C2E45C}
html[data-theme="light"][data-accent="gold"]{--accent-soft:rgba(201,169,106,.18);--accent:#DCC493}
html[data-theme="light"][data-accent="jade"]{--accent-soft:rgba(121,226,175,.2);--accent:#5FD3A0}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:400 14px/1.56 var(--font-body);
  letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(820px 460px at 84% -10%, var(--accent-soft), transparent 62%),
    radial-gradient(620px 480px at -8% 104%, rgba(232,211,169,.05), transparent 64%),
    radial-gradient(700px 420px at 46% 118%, rgba(121,226,175,.035), transparent 70%);
}
html[data-theme="light"] body::before{
  background:
    radial-gradient(820px 460px at 84% -10%, rgba(169,206,63,.12), transparent 62%),
    radial-gradient(620px 480px at -8% 104%, rgba(201,169,106,.12), transparent 64%);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.num,.bal,.v,.amt{font-variant-numeric:tabular-nums}

/* ---------------- shell ---------------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;
  padding:26px 18px 22px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 42%);
}
html[data-theme="light"] .rail{background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 42%)}
.brand{display:flex;align-items:center;gap:11px;padding:0 4px}
.mark{
  width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--lime) 0%,var(--gold) 78%);
  color:#0A0A0B;font:700 15px/1 var(--font-display);letter-spacing:-.03em;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 10px 24px -12px rgba(205,239,110,.55);
}
.brand .word{display:flex;align-items:center;gap:6px;
  font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.015em}
.brand .tag{
  font-size:9px;font-weight:600;letter-spacing:.06em;padding:2px 5px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)
}
.brand .sub{display:block;margin-top:2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.nav .group{
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  padding:0 12px;margin:2px 0 6px;
}
.nav button{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px 10px 14px;border-radius:12px;color:var(--muted);
  font-size:13.5px;font-weight:400;transition:background .16s,color .16s;
}
.nav button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav button:hover{background:var(--surface-2);color:var(--text-2)}
.nav button.on{background:linear-gradient(90deg,var(--accent-soft),rgba(255,255,255,0) 92%);color:var(--text);font-weight:500}
.nav button.on::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:17px;border-radius:99px;
  background:linear-gradient(180deg,var(--lime),var(--gold));
  box-shadow:0 0 12px rgba(232,211,169,.35);
}
.nav button.on svg{color:var(--accent);opacity:1}
.nav .count{
  margin-left:auto;min-width:20px;text-align:center;font-size:10.5px;color:var(--text-2);
  background:var(--surface-3);border:1px solid var(--line);border-radius:99px;padding:1px 6px;
  font-family:var(--font-display)
}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:0 4px}
.rail-foot .divider{height:1px;margin:0 -4px;background:linear-gradient(90deg,rgba(205,239,110,.42),rgba(232,211,169,.34),transparent 92%)}
.foot-block{display:flex;flex-direction:column;gap:8px}
.foot-block .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.sw{display:flex;gap:8px}
.sw button{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1px var(--line-strong) inset;transition:transform .16s,box-shadow .16s}
.sw button:hover{transform:translateY(-1px)}
.sw button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--text)}
.ghost{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:9px 11px;border:1px solid var(--line);border-radius:11px;color:var(--muted);
  font-size:12px;background:var(--surface);transition:border-color .16s,color .16s;
}
.ghost:hover{color:var(--text);border-color:var(--line-strong)}
.ghost svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.currency{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.currency b{font-family:var(--font-display);color:var(--text-2);font-weight:500;letter-spacing:0}
.version{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:11px;
  border-top:1px solid var(--line-faint);font-size:10.5px;color:var(--faint);letter-spacing:.02em;
}
.version b{font-family:var(--font-display);font-weight:500;color:var(--gold);letter-spacing:0}

/* ---------------- recovered-from-Sable banner ---------------- */
.banner{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 14px 12px 16px;
  border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:var(--r);
  background:linear-gradient(90deg,rgba(232,211,169,.09),rgba(232,211,169,.02) 60%,transparent);
}
.banner .ico{color:var(--gold);font-size:13px;line-height:1}
.banner .body{flex:1;min-width:0;font-size:12.5px;color:var(--text-2)}
.banner .body b{font-family:var(--font-display);font-weight:500;color:var(--text);margin-right:6px}
.banner .body span{color:var(--muted)}
.banner button{
  flex:none;font-size:11.5px;font-weight:500;color:var(--gold);padding:6px 11px;border-radius:9px;
  border:1px solid rgba(232,211,169,.32);background:rgba(232,211,169,.07);transition:background .16s;
}
.banner button:hover{background:rgba(232,211,169,.16)}
@media (max-width:600px){.banner{align-items:flex-start;flex-wrap:wrap}.banner .body{flex:1 1 100%}}

/* ---------------- main ---------------- */
main{min-width:0;width:100%;max-width:1180px;margin:0 auto;padding:34px 40px 110px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px}
.top .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.top h1{
  margin:0;font-family:var(--font-display);font-size:30px;font-weight:600;
  letter-spacing:-.028em;line-height:1.1;color:var(--text);
}
.top .sub{margin-top:7px;font-size:12.5px;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .16s,border-color .16s,transform .16s,box-shadow .16s;
}
.btn:hover{background:var(--surface-3);border-color:var(--line-strong);transform:translateY(-1px)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.btn.pri{
  background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600;
  box-shadow:0 12px 30px -16px var(--accent-glow),0 1px 0 rgba(255,255,255,.28) inset;
}
.btn.pri:hover{filter:brightness(1.04);box-shadow:0 16px 34px -16px var(--accent-glow)}

/* ---------------- hero ---------------- */
.hero{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-xl);
  padding:28px 30px 26px;margin-bottom:14px;
  background:linear-gradient(158deg,rgba(205,239,110,.055),transparent 40%),linear-gradient(180deg,#121217,#0D0D11);
}
html[data-theme="light"] .hero{background:linear-gradient(158deg,rgba(205,239,110,.16),transparent 46%),linear-gradient(180deg,#FFFFFF,#FBFAF6)}
.hero::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,var(--accent),rgba(232,211,169,.85) 42%,transparent 74%);
  opacity:.85;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(620px 260px at 6% -30%,var(--accent-soft),transparent 68%),
             radial-gradient(420px 240px at 96% 118%,rgba(232,211,169,.07),transparent 70%);
}
.lbl{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--faint)}
.hero .bal{
  position:relative;z-index:1;margin:10px 0 26px;
  font-family:var(--font-display);font-size:58px;font-weight:600;
  line-height:1.02;letter-spacing:-.035em;
}
.hero .bal em{font-style:normal;font-size:.44em;font-weight:500;color:var(--gold);margin-right:8px;vertical-align:.12em;letter-spacing:0}
.kpis{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding-top:20px;border-top:1px solid var(--line)}
.kpi{padding-right:18px}
.kpi + .kpi{border-left:1px solid var(--line);padding-left:20px}
.kpi .k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.kpi .v{margin-top:5px;font-family:var(--font-display);font-size:20px;font-weight:500;letter-spacing:-.02em}
.up{color:var(--up)}
.down{color:var(--down)}
.gold{color:var(--gold)}

/* ---------------- sections + cards ---------------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 2px 13px}
.sec h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.sec .link{font-size:12px;color:var(--muted);transition:color .16s}
.sec .link:hover{color:var(--accent)}
.grid{display:grid;gap:12px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card.flat{padding:6px 20px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-head .t{font-family:var(--font-display);font-size:14px;font-weight:500;letter-spacing:-.01em}
.card-head .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.cols{display:grid;grid-template-columns:1.08fr .92fr;gap:12px;align-items:start}

/* ---------------- accounts ---------------- */
.acct{
  position:relative;overflow:hidden;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);padding:17px 18px 16px;
  background:linear-gradient(168deg,#121217,#0E0E12);
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
html[data-theme="light"] .acct{background:linear-gradient(168deg,#FFFFFF,#FAF9F5)}
.acct:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 22px 44px -32px #000}
.acct::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(240px 150px at 100% -10%,var(--glow,rgba(255,255,255,.06)),transparent 72%);
}
.acct .bank{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.acct .dot{width:7px;height:7px;border-radius:50%;flex:none}
.acct .name{font-size:13.5px;font-weight:500;margin:3px 0 22px;color:var(--text-2)}
.acct .amt{position:relative;z-index:1;font-family:var(--font-display);font-size:25px;font-weight:500;letter-spacing:-.03em;line-height:1}
.acct .amt em{font-style:normal;font-size:.68em;font-weight:500;color:var(--gold);margin-right:2px;vertical-align:.06em;letter-spacing:0}
.acct-wrap{display:flex;flex-direction:column;gap:5px}
.mini{
  font-size:11px;color:var(--faint);padding:5px 10px;border-radius:8px;align-self:flex-end;
  border:1px solid transparent;transition:color .16s,background .16s,border-color .16s;
}
.mini:hover{color:var(--text);background:var(--surface-2);border-color:var(--line)}
.mini.sure{color:var(--down);border-color:rgba(255,143,123,.35);background:rgba(255,143,123,.1)}

/* ---------------- cash flow ---------------- */
.legend{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-2);
  font-family:var(--font-display);font-size:11.5px;font-weight:500;
}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px}
.flow-col{display:flex;flex-direction:column;align-items:center;gap:9px}
.flow-bars{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:144px;width:100%}
.flow-bars i{width:16px;border-radius:99px;min-height:4px;transition:height .4s ease}
.flow-bars i.in{background:linear-gradient(180deg,var(--lime),var(--lime-deep));box-shadow:0 -6px 18px -10px var(--lime)}
.flow-bars i.out{background:linear-gradient(180deg,rgba(255,143,123,.9),rgba(255,143,123,.18))}
html[data-theme="light"] .flow-bars i.in{background:linear-gradient(180deg,#B9DC4D,#8FB822)}
.flow-col .m{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-family:var(--font-display)}
.flow-col.now .m{color:var(--gold)}
.flow-col.now .m::after{content:"";display:block;width:14px;height:1px;margin:5px auto 0;background:linear-gradient(90deg,var(--lime),var(--gold))}

/* ---------------- bars (categories) ---------------- */
.bars{display:flex;flex-direction:column;gap:15px}
.barrow .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.barrow .head .n{font-size:13px;color:var(--text-2)}
.barrow .head .v{font-family:var(--font-display);font-size:12.5px;color:var(--text);letter-spacing:-.01em}
.track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .4s ease}

/* ---------------- rows ---------------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-faint)}
.row:last-child{border-bottom:0}
.dot-ico{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-size:15px;background:var(--surface-2);border:1px solid var(--line);
}
.row .t{flex:1;min-width:0}
.row .t .a{font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .a .note{color:var(--faint)}
.row .t .b{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.amt{font-family:var(--font-display);font-size:13.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.x{color:var(--faint);font-size:11px;padding:5px 8px;border-radius:8px;transition:color .16s,background .16s;white-space:nowrap}
.x:hover{color:var(--text);background:var(--surface-3)}
.x.sure{color:var(--down);background:rgba(255,143,123,.12)}
.empty{padding:30px 8px;text-align:center;color:var(--faint);font-size:12.5px}

/* ---------------- filters / inputs ---------------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
select,input[type=text],input[type=number],input[type=date]{
  width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--text);font-size:13px;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
select:hover,input:hover{border-color:var(--line-strong);background:var(--surface-3)}
input::placeholder{color:var(--faint)}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters select{width:auto;flex:1;min-width:150px;padding:9px 32px 9px 12px;font-size:12.5px;background:var(--surface)}
.filters input[type=date]{width:auto;flex:1;min-width:150px;padding:9px 12px;font-size:12.5px;background:var(--surface)}
select{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 53%,calc(100% - 11px) 53%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;
}
.sumstrip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.sumstrip .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.sumstrip b{font-family:var(--font-display);font-weight:500;color:var(--text-2)}

/* ---------------- modal ---------------- */
#modal{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,4,6,.66);backdrop-filter:blur(8px);
}
#modal.open{display:flex}
.sheet{
  position:relative;width:100%;max-width:478px;max-height:90vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:24px;padding:26px;
  box-shadow:0 50px 100px -46px #000;
}
.sheet::before{
  content:"";position:absolute;top:0;left:26px;right:26px;height:1px;
  background:linear-gradient(90deg,var(--lime),var(--gold) 55%,transparent);opacity:.8;
}
.sheet h3{
  margin:0 0 20px;font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-.02em;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.sheet h3 .esc{color:var(--faint);font-size:11.5px;font-weight:400;font-family:var(--font-body);letter-spacing:0}
.f{margin-bottom:14px}
.f label{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:20px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:12.5px;color:var(--muted);transition:background .16s,color .16s;font-weight:500}
.seg button:hover{color:var(--text-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 6px 16px -10px var(--accent-glow)}
.btns{display:flex;gap:10px;margin-top:22px}
.btns button{
  flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:500;
  background:var(--surface-2);border:1px solid var(--line-strong);
}
.btns button:hover{background:var(--surface-3)}
.btns .pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.btns .pri:hover{filter:brightness(1.04);background:var(--accent)}
.err{color:var(--down);font-size:12px;min-height:16px;margin-top:4px}

/* ---------------- responsive ---------------- */
@media (max-width:1040px){
  .cols{grid-template-columns:1fr}
  .hero .bal{font-size:50px}
}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;gap:12px;
    padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);
    background:rgba(8,8,10,.88);backdrop-filter:blur(14px);overflow-x:auto;
  }
  html[data-theme="light"] .rail{background:rgba(244,243,239,.9)}
  .brand .sub,.brand .word .tag{display:none}
  .nav{flex-direction:row;margin:0;gap:2px}
  .nav .group{display:none}
  .nav button{padding:8px 11px 8px 11px;white-space:nowrap}
  .nav button.on::before{display:none}
  .nav .count{display:none}
  .rail-foot{flex-direction:row;margin:0 0 0 auto;gap:10px;padding:0}
  .rail-foot .divider,.foot-block:first-child,.foot-block .k{display:none}
  .ghost{padding:8px 10px}
  main{padding:24px 18px 96px}
  .hero{padding:24px 22px}
  .kpis{grid-template-columns:1fr 1fr;gap:18px 2px}
  .kpi:nth-child(3){border-left:0;padding-left:0}
  .kpi + .kpi{padding-right:0}
  .top{flex-wrap:wrap;align-items:center}
  .top h1{font-size:25px}
}
@media (max-width:600px){
  .hero .bal{font-size:38px}
  .flow{gap:6px}
  .flow-bars{height:104px}
  .flow-bars i{width:10px}
  .sheet{border-radius:20px;padding:21px}
  .filters select{min-width:0;flex:1 1 46%}
  .btn.pri span{display:none}
  .currency{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">W</div>
      <div>
        <div class="word">WiseSpend <span class="tag">2.1</span></div>
        <span class="sub">Finance tracker</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="divider"></div>
      <div class="foot-block">
        <div class="k">Accent</div>
        <div class="sw" id="sw"></div>
      </div>
      <div class="foot-block">
        <button class="ghost" id="theme">
          <span id="themeLabel">Dark</span>
          <svg viewBox="0 0 24 24"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1 1M18.8 18.8l1 1M3 12h1.5M19.5 12H21M4.2 19.8l1-1M18.8 5.2l1-1"/><circle cx="12" cy="12" r="3.6"/></svg>
        </button>
        <div class="currency"><span>Currency</span><b>INR ₹</b></div>
        <div class="version" id="version">WiseSpend <b>v2.1.0</b></div>
      </div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div>
        <div class="eyebrow" id="eyebrow">WiseSpend</div>
        <h1 id="title">Overview</h1>
        <div class="sub" id="today"></div>
      </div>
      <button class="btn pri" id="fab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New transaction</span>
      </button>
    </div>
    <div id="notice"></div>
    <div id="app"></div>
  </main>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="calc.js"></script>
<script>
/* ---------- palette + prefs ---------- */
const P = ['#CDEF6E','#79E2AF','#F5CE73','#8FCDF5','#BCA9FF','#F5A8C0','#FF8F7B','#E8D3A9'];
const ACCENTS = {
  lime:{a:'#CDEF6E', ink:'#0A0A0B', label:'Lime'},
  gold:{a:'#E8D3A9', ink:'#0A0A0B', label:'Gold'},
  jade:{a:'#79E2AF', ink:'#04120C', label:'Jade'}
};
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (n, d) => new Intl.NumberFormat('en-IN',{maximumFractionDigits:d}).format(Math.abs(n || 0));
const sgn = n => (n || 0) < 0 ? '−' : '';
const CUR = () => (S && S.prefs && S.prefs.symbol) || '₹';
const fmt  = n => `${sgn(n)}${CUR()}${num(n, 2)}`;
const fmt2 = n => `${sgn(n)}${CUR()}${num(n, 0)}`;
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fdate = d => new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const seed = () => ({
  accounts:[{id:'a1',name:'Cash',bank:'Wallet',type:'cash',open:0,color:P[1]}],
  cats:[['Food','🍜','expense',P[2]],['Transport','🚌','expense',P[3]],['Rent','🏠','expense',P[4]],['Shopping','🛍️','expense',P[5]],['Salary','💼','income',P[1]],['Freelance','✨','income',P[0]]].map(c=>({id:uid(),name:c[0],emoji:c[1],type:c[2],color:c[3]})),
  tx:[],
  prefs:{theme:'dark',accent:'lime',currency:'INR',symbol:'₹',locale:'en-IN'},
  budgets:[],
  goals:[],
  recurring:[],
  reminders:[],
  loans:[],
  assets:[],
  liabilities:[]
});

/* ---------- state (migrates Sable 1.x data) ---------- */
const KEY = 'wisespend-v2';
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('sable-v1')); } catch(e) {}
S = S || seed();
S.prefs = Object.assign({theme:'dark',accent:'lime',currency:'INR',symbol:'₹',locale:'en-IN'}, S.prefs || {});
if (!ACCENTS[S.prefs.accent]) S.prefs.accent = 'lime';
S.budgets = Array.isArray(S.budgets) ? S.budgets : [];
S.goals = Array.isArray(S.goals) ? S.goals : [];
S.recurring = Array.isArray(S.recurring) ? S.recurring : [];
S.reminders = Array.isArray(S.reminders) ? S.reminders : [];
S.loans = Array.isArray(S.loans) ? S.loans : [];
S.assets = Array.isArray(S.assets) ? S.assets : [];
S.liabilities = Array.isArray(S.liabilities) ? S.liabilities : [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} try { const b = JSON.parse(localStorage.getItem('wisespend-backups') || '[]'); b.unshift({at:new Date().toISOString(), data:JSON.parse(JSON.stringify(S))}); while (b.length > 5) b.pop(); localStorage.setItem('wisespend-backups', JSON.stringify(b)); } catch(e) {} };
const VERSION = new URLSearchParams(location.search).get('v') || '2.1.0';

let view = 'home', F = {acc:'', cat:'', type:'', q:'', from:'', to:'', month:'', sort:'newest'}, armed = null, pick = P[0], ttype = 'expense', editId = null, lastDeleted = null, undoTimer = null;

const acc = id => S.accounts.find(a => a.id === id);
const cat = id => S.cats.find(c => c.id === id);
const bal = a => Calc.balance(a, S.tx);
const sorted = l => [...l].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
const tint = (hex, alpha) => {
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(x=>x+x).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
};
const mk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const lastMonths = n => {
  const out = [], now = new Date();
  for (let i = n-1; i >= 0; i--) out.push(new Date(now.getFullYear(), now.getMonth()-i, 1));
  return out;
};

/* ---------- icons ---------- */
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.6 10.4V20h10.8v-9.6"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  wallet:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><path d="M16.5 15h1.5"/></svg>',
  tag:'<svg viewBox="0 0 24 24"><path d="M4 12.4V5.2A1.2 1.2 0 0 1 5.2 4h7.2l7.6 7.6-8.4 8.4L4 12.4Z"/><circle cx="8.4" cy="8.4" r="1.3"/></svg>'
};

/* ---------- prefs ---------- */
function applyPrefs(){
  const p = S.prefs;
  document.documentElement.dataset.theme = p.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.accent = ACCENTS[p.accent] ? p.accent : 'lime';
  const tl = $('#themeLabel'); if (tl) tl.textContent = p.theme === 'light' ? 'Light' : 'Dark';
  const sw = $('#sw');
  if (sw) sw.innerHTML = Object.entries(ACCENTS).map(([k,v]) =>
    `<button data-accent="${k}" class="${p.accent===k?'on':''}" style="background:${v.a}" aria-label="${v.label} accent" title="${v.label}"></button>`).join('');
}

/* ---------- rows ---------- */
function txRow(t){
  const c = cat(t.cat), a = acc(t.acc), to = acc(t.to);
  const title = t.type === 'transfer' ? 'Transfer' : (c ? c.name : 'Uncategorised');
  const where = t.type === 'transfer' ? `${esc(a?.name || '—')} → ${esc(to?.name || '—')}` : esc(a?.name || '—');
  const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '';
  const cls = t.type === 'income' ? 'up' : t.type === 'expense' ? 'down' : '';
  const tintColor = t.type === 'transfer' ? '#BCA9FF' : (c?.color || '#8B8A93');
  const glyph = t.type === 'transfer' ? '⇄' : (c?.emoji || '•');
  return `<div class="row">
    <div class="dot-ico" style="background:${tint(tintColor,.13)};border-color:${tint(tintColor,.24)};color:${tintColor}">${glyph}</div>
    <div class="t"><div class="a">${esc(title)}${t.note?' <span class="note">· '+esc(t.note)+'</span>':''}</div>
      <div class="b">${where} · ${fdate(t.date)}</div></div>
    <div class="amt ${cls}">${sign}${fmt(t.amount)}</div>
    <button class="x" data-edit="${t.id}" aria-label="Edit transaction">✎</button>
    <button class="x" data-dup="${t.id}" aria-label="Duplicate transaction">⧉</button>
    <button class="x ${armed==='t'+t.id?'sure':''}" data-del="t${t.id}" aria-label="Delete transaction">${armed==='t'+t.id?'Sure?':'✕'}</button>
  </div>`;
}

/* ---------- views ---------- */
const TITLES = {home:'Overview', tx:'Transactions', acc:'Accounts', cat:'Categories', bud:'Budgets', goals:'Savings goals', rec:'Recurring', insights:'Insights', forecast:'Forecast', nw:'Net worth', cal:'Calendar', settings:'Settings'};
const EYEBROWS = {home:'Total picture', tx:'Every movement', acc:'Where money sits', cat:'How money is sorted', bud:'Spend limits', goals:'Money kept', rec:'Scheduled', insights:'Analysis', forecast:'Future', nw:'Position', cal:'Timeline', settings:'Preferences'};

function render(){
  const d = new Date();
  $('#eyebrow').textContent = EYEBROWS[view];
  $('#today').textContent = d.toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long'});
  $('#title').textContent = TITLES[view];
  $('#nav').innerHTML = [['home','Overview','home'],['tx','Transactions','list'],['bud','Budgets','tag'],['goals','Goals','tag'],['rec','Recurring','list'],['insights','Insights','list'],['forecast','Forecast','list'],['acc','Accounts','wallet'],['nw','Net worth','wallet'],['cal','Calendar','list'],['cat','Categories','tag'],['settings','Settings','tag']]
    .map(([v,label,icon]) => `<button data-v="${v}" class="${view===v?'on':''}">${ICON[icon]}<span>${label}</span></button>`).join('');
  $('#notice').innerHTML = noticeHTML();
  $('#app').innerHTML = ({home, tx:txView, acc:accountsView, cat:catsView, bud:budgetsView, goals:goalsView, rec:recurringView, insights:insightsView, forecast:forecastView, nw:networthView, cal:calendarView, settings:settingsView})[view]();
  applyPrefs();
}

function noticeHTML(){
  const p = S.prefs;
  if (!p.importedAt || p.importedSeen) return '';
  const n = +p.importedCount || 0;
  return `<div class="banner">
    <span class="ico">✦</span>
    <div class="body"><b>Recovered from Sable</b> <span>${n} transaction${n===1?'':'s'}, ${S.accounts.length} account${S.accounts.length===1?'':'s'} and ${S.cats.length} categories carried over.</span></div>
    <button data-dismiss-note>Got it</button>
  </div>`;
}

/* ---------- adopt the Sable 1.x store handed over by main.js ---------- */
function adoptLegacyStore(raw){
  if (!raw) return null;
  let old;
  try { old = JSON.parse(raw); } catch(e) { return null; }
  if (!old || !Array.isArray(old.accounts) || !Array.isArray(old.cats) || !Array.isArray(old.tx)) return null;

  const untouched = !localStorage.getItem(KEY);
  let added = 0;

  if (untouched) {
    S.accounts = old.accounts.map(a => Object.assign({}, a));
    S.cats = old.cats.map(c => Object.assign({}, c));
    S.tx = old.tx.map(t => Object.assign({}, t));
    S.prefs = Object.assign({}, S.prefs, old.prefs || {});
    // 1.x shipped champagne / jade / iris accents; keep the gold one going
    const carried = { champagne: 'gold', iris: 'jade' }[S.prefs.accent] || S.prefs.accent;
    S.prefs.accent = ACCENTS[carried] ? carried : 'lime';
    added = S.tx.length;
  } else {
    // the new store already has entries: merge without duplicating anything
    const accIds = new Set(S.accounts.map(a => a.id));
    const catIds = new Set(S.cats.map(c => c.id));
    const txIds = new Set(S.tx.map(t => t.id));
    old.accounts.forEach(a => { if (a && a.id && !accIds.has(a.id)) { S.accounts.push(a); accIds.add(a.id); } });
    old.cats.forEach(c => { if (c && c.id && !catIds.has(c.id)) { S.cats.push(c); catIds.add(c.id); } });
    old.tx.forEach(t => { if (t && t.id && !txIds.has(t.id)) { S.tx.push(t); txIds.add(t.id); added++; } });
  }

  if (added) {
    S.prefs.importedAt = new Date().toISOString();
    S.prefs.importedCount = added;
    S.prefs.importedSeen = false;
  }
  save();
  if (added) { view = 'home'; }
  render();
  return added;
}
window.__wisespendAdopt = adoptLegacyStore;

function home(){
  const m = todayStr().slice(0,7);
  const { income: inc, expense: exp, net } = Calc.monthlyTotals(S.tx, m);
  const total = Calc.totalBalance(S.accounts, S.tx);
  const spend = Calc.spendingByCategory(S.tx, m);
  const bars = Object.entries(spend).sort((a,b) => b[1]-a[1]).slice(0,5).map(([id,v]) => {
    const c = cat(id);
    return {name:c ? `${c.emoji} ${c.name}` : 'Uncategorised', color:c?.color || '#8B8A93', v};
  });
  const maxBar = Math.max(1, ...bars.map(b => b.v));

  const flow = lastMonths(6).map(d => {
    const k = mk(d);
    const t = Calc.monthlyTotals(S.tx, k);
    return {
      label: d.toLocaleDateString('en-IN',{month:'short'}),
      inc: t.income,
      exp: t.expense,
      now: k === m
    };
  });
  const maxFlow = Math.max(1, ...flow.flatMap(f => [f.inc, f.exp]));
  const h = v => v ? Math.max(6, Math.round(v / maxFlow * 100)) : 2;

  return `
  <section class="hero">
    <div class="lbl">Total balance</div>
    <div class="bal">${sgn(total)}<em>${CUR()}</em>${num(total, 2)}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">Income · this month</div><div class="v up">+${fmt2(inc)}</div></div>
      <div class="kpi"><div class="k">Spent · this month</div><div class="v down">−${fmt2(exp)}</div></div>
      <div class="kpi"><div class="k">Saved · this month</div><div class="v ${net >= 0 ? 'gold' : 'down'}">${net >= 0 ? '+' : '−'}${fmt2(Math.abs(net))}</div></div>
      <div class="kpi"><div class="k">Across</div><div class="v">${S.accounts.length} account${S.accounts.length===1?'':'s'}</div></div>
    </div>
  </section>

  <div class="sec"><h2>Accounts</h2><button class="link" data-v="acc">See all</button></div>
  <div class="grid g-auto">${S.accounts.map(accCard).join('') || '<div class="card empty">No accounts yet — add one to begin.</div>'}</div>

  <div class="sec"><h2>Money flow · last 6 months</h2>
    <div class="chip ${net>=0?'up':'down'}">${net>=0?'+':'−'}${fmt2(Math.abs(net))} this month</div>
  </div>
  <div class="card">
    <div class="card-head">
      <div><div class="t">In and out</div><div class="s">Income against expenses, month by month</div></div>
      <div class="legend">
        <span><i style="background:var(--lime)"></i>In</span>
        <span><i style="background:var(--coral)"></i>Out</span>
      </div>
    </div>
    <div class="flow">${flow.map(f => `
      <div class="flow-col ${f.now?'now':''}">
        <div class="flow-bars">
          <i class="in" style="height:${h(f.inc)}%" title="Income ${fmt2(f.inc)}"></i>
          <i class="out" style="height:${h(f.exp)}%" title="Expenses ${fmt2(f.exp)}"></i>
        </div>
        <span class="m">${f.label}</span>
      </div>`).join('')}</div>
  </div>

  <div class="sec"><h2>This month</h2><button class="link" data-v="tx">All transactions</button></div>
  <div class="cols">
    <div class="card">
      <div class="card-head">
        <div><div class="t">Spending by category</div><div class="s">${fmt2(exp)} across ${bars.length} categor${bars.length===1?'y':'ies'}</div></div>
        <div class="chip">${inc > 0 ? Math.round(Math.min(100, exp / inc * 100)) + '% of income' : 'No income yet'}</div>
      </div>
      ${bars.length ? `<div class="bars">${bars.map(b => `
        <div class="barrow">
          <div class="head"><span class="n">${esc(b.name)}</span><span class="v">${fmt2(b.v)}</span></div>
          <div class="track"><i style="width:${Math.max(3,(b.v/maxBar*100)).toFixed(1)}%;background:linear-gradient(90deg,${b.color},${tint(b.color,.35)})"></i></div>
        </div>`).join('')}</div>`
      : '<div class="empty">No expenses logged this month.</div>'}
    </div>
    <div class="card flat">
      ${S.tx.length ? sorted(S.tx).slice(0,6).map(txRow).join('') : '<div class="empty">Nothing yet. Add your first transaction.</div>'}
    </div>
  </div>`;
}

const accCard = a => `<button class="acct" data-log="${a.id}" style="--glow:${tint(a.color,.16)}">
  <div class="bank"><span class="dot" style="background:${a.color}"></span>${esc(a.bank)}</div>
  <div class="name">${esc(a.name)}</div>
  <div class="amt">${sgn(bal(a))}<em>${CUR()}</em>${num(bal(a), 2)}</div>
</button>`;

function txView(){
  const months = [...new Set(S.tx.map(t => t.date.slice(0,7)))].sort().reverse();
  let l = S.tx.filter(t => {
    if (F.acc && t.acc !== F.acc && t.to !== F.acc) return false;
    if (F.cat && t.cat !== F.cat) return false;
    if (F.type && t.type !== F.type) return false;
    if (F.month && !t.date.startsWith(F.month)) return false;
    if (F.from && t.date < F.from) return false;
    if (F.to && t.date > F.to) return false;
    if (F.q) {
      const q = F.q.toLowerCase();
      const c = cat(t.cat);
      const a = acc(t.acc); const to = acc(t.to);
      const hay = [t.amount, t.note, c?.name, a?.name, to?.name, t.type].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (F.sort === 'oldest') l.sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  else if (F.sort === 'highest') l.sort((a,b) => +b.amount - +a.amount);
  else if (F.sort === 'lowest') l.sort((a,b) => +a.amount - +b.amount);
  else l = sorted(l);
  const o = (arr, sel) => arr.map(x => `<option value="${x.id||x[0]}" ${sel===(x.id||x[0])?'selected':''}>${esc(x.name||x[1])}</option>`).join('');
  const sum = l.reduce((s,t) => s + (t.type === 'income' ? +t.amount : t.type === 'expense' ? -+t.amount : 0), 0);
  return `<div class="filters">
    <input type="search" data-f="q" placeholder="Search notes, amounts, accounts…" value="${esc(F.q)}" style="flex:1;min-width:180px">
    <select data-f="type"><option value="">All types</option>${o([['expense','Expenses'],['income','Income'],['transfer','Transfers']], F.type)}</select>
    <select data-f="acc"><option value="">All accounts</option>${o(S.accounts, F.acc)}</select>
    <select data-f="cat"><option value="">All categories</option>${o(S.cats, F.cat)}</select>
  </div>
  <div class="filters">
    <select data-f="month"><option value="">All months</option>${months.map(m => `<option value="${m}" ${F.month===m?'selected':''}>${m}</option>`).join('')}</select>
    <input type="date" data-f="from" value="${F.from}" title="From date">
    <input type="date" data-f="to" value="${F.to}" title="To date">
    <select data-f="sort"><option value="newest" ${F.sort==='newest'?'selected':''}>Newest first</option><option value="oldest" ${F.sort==='oldest'?'selected':''}>Oldest first</option><option value="highest" ${F.sort==='highest'?'selected':''}>Highest amount</option><option value="lowest" ${F.sort==='lowest'?'selected':''}>Lowest amount</option></select>
    <button class="btn" data-exportcsv>Export CSV</button>
    <button class="btn" data-backup>Backup JSON</button>
    <button class="btn" data-importjson>Import JSON</button>
    <button class="btn" data-importcsv>Import CSV</button>
  </div>
  <div class="sumstrip">
    <span class="k">${l.length} transaction${l.length===1?'':'s'}</span>
    <span class="k">Net <b class="${sum>=0?'up':'down'}">${sum>=0?'+':'−'}${fmt2(Math.abs(sum))}</b></span>
    ${lastDeleted ? `<button class="btn" data-undo>Undo delete</button>` : ''}
  </div>
  <div class="card flat">${l.length ? l.map(txRow).join('') : '<div class="empty">Nothing matches these filters.</div>'}</div>`;
}

function budgetsView(){
  const m = F.month || todayStr().slice(0,7);
  const spentByCat = Calc.spendingByCategory(S.tx, m);
  const totalSpent = Object.values(spentByCat).reduce((a,b)=>a+b,0);
  const overall = S.budgets.find(b => b.month === m && !b.cat);
  const catBudgets = S.budgets.filter(b => b.month === m && b.cat);
  const budgetChip = pct => pct >= 90 ? 'down' : pct >= 70 ? 'gold' : 'up';
  let html = `<div class="sec" style="margin-top:4px"><h2>Budgets · ${m}</h2>
    <div style="display:flex;gap:8px"><button class="btn" data-newbudget>+ New budget</button>
    <button class="btn" data-copybudget>Copy to next month</button></div></div>`;
  // month selector
  html += `<div class="filters"><input type="month" data-f="month" value="${m}"></div>`;
  // overall
  if (overall) {
    const p = Calc.budgetProgress(overall.limit, totalSpent);
    html += `<div class="card"><div class="card-head"><div><div class="t">Overall monthly limit</div><div class="s">${fmt2(totalSpent)} of ${fmt2(overall.limit)}</div></div><div class="chip ${budgetChip(p.pct)}">${Math.round(p.pct)}%</div></div>
      <div class="track"><i style="width:${p.pct.toFixed(1)}%;background:var(--accent)"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)"><span>Remaining ${fmt2(p.remaining)}</span><span>${p.over?'Over budget!':p.pct>=90?'Almost there':p.pct>=70?'Heads up':''}</span></div></div>`;
  }
  // per category
  html += `<div class="grid g-auto">`;
  S.cats.filter(c => c.type === 'expense').forEach(c => {
    const b = catBudgets.find(x => x.cat === c.id);
    if (!b) return;
    const spent = spentByCat[c.id] || 0;
    const p = Calc.budgetProgress(b.limit, spent);
    html += `<div class="card"><div class="card-head"><div><div class="t">${c.emoji} ${esc(c.name)}</div><div class="s">${fmt2(spent)} of ${fmt2(b.limit)}</div></div><div class="chip ${budgetChip(p.pct)}">${Math.round(p.pct)}%</div></div>
      <div class="track"><i style="width:${p.pct.toFixed(1)}%;background:${c.color}"></i></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:6px">${p.over?'Over':p.pct>=90?'90%+':p.pct>=70?'70%+':''}</div></div>`;
  });
  html += `</div>`;
  // unbudgeted categories
  const unbudgeted = S.cats.filter(c => c.type==='expense' && !catBudgets.find(x=>x.cat===c.id));
  if (unbudgeted.length) html += `<div class="card" style="margin-top:12px"><div class="t" style="margin-bottom:8px">Unbudgeted expense categories</div>${unbudgeted.map(c => `<div class="row"><span>${c.emoji} ${esc(c.name)}</span><button class="btn" data-newbudgetcat="${c.id}">Set budget</button></div>`).join('')}</div>`;
  // previous month comparison
  const prevM = new Date(m+'-01'); prevM.setMonth(prevM.getMonth()-1); const pk = `${prevM.getFullYear()}-${String(prevM.getMonth()+1).padStart(2,'0')}`;
  const prevSpent = Calc.monthlyTotals(S.tx, pk).expense;
  html += `<div class="card" style="margin-top:12px"><div class="t">vs last month</div><div class="s">This month ${fmt2(totalSpent)} · Last month ${fmt2(prevSpent)} · ${prevSpent>0? (totalSpent>prevSpent?'+':'') + Math.round((totalSpent-prevSpent)/prevSpent*100) + '%' : 'n/a'}</div></div>`;
  return html;
}

      <div style="display:flex;align-items:center;gap:16px">

function recurringView(){
  const subs = S.recurring.filter(r => r.sub);
  const monthlySub = subs.reduce((s,r) => s + Calc.recurringMonthly(r), 0);
  const yearlySub = monthlySub*12;

  html += `<div class="card"><div class="t">Subscriptions</div><div class="s">Monthly ${fmt2(monthlySub)} · Yearly ${fmt2(yearlySub)} · ${subs.length} active</div></div>`;
  // upcoming payments next 30 days
  const today = new Date(); const in30 = new Date(today.getTime()+30*86400000);
  const upcoming = S.recurring.filter(r => r.active && r.nextDate && new Date(r.nextDate) <= in30).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  html += `<div class="card" style="margin-top:12px"><div class="t">Upcoming payments (30 days)</div>`;
  if (!upcoming.length) html += `<div class="empty">No upcoming payments.</div>`;
  upcoming.forEach(r => { html += `<div class="row"><div class="t"><div class="a">${esc(r.name||r.note||'Recurring')}</div><div class="b">${r.nextDate} · ${r.freq}</div></div><div class="amt ${r.type==='income'?'up':'down'}">${fmt(r.amount)}</div></div>`; });
  html += `</div>`;
  html += `<div class="card flat" style="margin-top:12px">`;
  if (!S.recurring.length) html += `<div class="empty">No recurring transactions yet.</div>`;
  S.recurring.forEach(r => {
    html += `<div class="row">
      <div class="t"><div class="a">${esc(r.name||r.note||'Recurring')} ${r.sub?'<span class="chip">sub</span>':''}</div><div class="b">${r.type} · ${r.freq} · next ${r.nextDate||'—'}${r.endDate?' · ends '+r.endDate:''}</div></div>
      <div class="amt">${fmt(r.amount)}</div>
      <button class="x" data-delrec="${r.id}">✕</button>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function insightsView(){
  const m = todayStr().slice(0,7);
  const months = lastMonths(12);
  const monthlyData = months.map(d => {
    const k = mk(d);
    const tx = S.tx.filter(t => t.date.startsWith(k));
    const inc = tx.filter(t=>t.type==='income').reduce((s,t)=>s+ +t.amount,0);
    const exp = tx.filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0);
    return {k, label:d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}), inc, exp, net:inc-exp, rate: inc>0? (inc-exp)/inc*100 : 0};
  });
  const cur = monthlyData[monthlyData.length-1];
  const prev = monthlyData[monthlyData.length-2];
  const avgDaily = cur.exp / new Date().getDate();
  // top categories this month
  const spend = {};
  S.tx.filter(t=>t.date.startsWith(m)&&t.type==='expense').forEach(t=>{ spend[t.cat||'']=(spend[t.cat||'']||0)+ +t.amount; });
  const totalSpent = Object.values(spend).reduce((a,b)=>a+b,0);
  const topCats = Object.entries(spend).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // highest spending day
  const byDay = {};
  S.tx.filter(t=>t.date.startsWith(m)&&t.type==='expense').forEach(t=>{ byDay[t.date]=(byDay[t.date]||0)+ +t.amount; });
  const topDay = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  // unusual spending: category spend > 2 std? simple: > 1.5x 6-month avg
  const insights = [];
  if (prev && prev.exp > 0) {
    const change = (cur.exp - prev.exp)/prev.exp*100;
    insights.push(`Spending ${change>=0?'increased':'decreased'} by ${Math.abs(change).toFixed(1)}% compared with last month.`);
  }
  if (cur.inc > 0) insights.push(`Savings rate this month: ${cur.rate.toFixed(1)}%.`);
  if (topDay) insights.push(`Highest spending day this month: ${topDay[0]} (${fmt2(topDay[1])}).`);
  if (topCats.length) insights.push(`Largest expense category this month: ${cat(topCats[0][0])?.name||'Uncategorised'} (${fmt2(topCats[0][1])}).`);
  // recurring detection: same note+amount repeated >=3
  const keyCount = {};
  S.tx.filter(t=>t.type==='expense').forEach(t=>{ const k=(t.note||'')+'|'+t.amount; keyCount[k]=(keyCount[k]||0)+1; });
  const recurring = Object.entries(keyCount).filter(([k,n])=>n>=3);
  if (recurring.length) insights.push(`Detected ${recurring.length} possible recurring expense(s).`);
  // essential vs discretionary
  const essentialCats = new Set(S.cats.filter(c=>c.essential).map(c=>c.id));
  const ess = S.tx.filter(t=>t.date.startsWith(m)&&t.type==='expense'&&essentialCats.has(t.cat)).reduce((s,t)=>s + (+t.amount || 0),0);
  const disc = totalSpent - ess;
  let html = `<div class="sec" style="margin-top:4px"><h2>Insights</h2></div>`;
  html += `<div class="card"><div class="t">WiseSpend Intelligence</div><ul style="margin:8px 0 0;padding-left:18px">` + (insights.length? insights.map(i=>`<li style="margin:4px 0">${esc(i)}</li>`).join('') : '<li>No insights yet — add transactions.</li>') + `</ul><div style="font-size:11px;color:var(--muted);margin-top:8px">All insights are calculated from your stored records.</div></div>`;
  html += `<div class="card" style="margin-top:12px"><div class="t">Monthly summary (last 6 months)</div>
    <div class="flow" style="grid-template-columns:repeat(6,1fr)">`;
  monthlyData.slice(-6).forEach(d => {
    const h = v => Math.max(2, Math.round(v/Math.max(1,...monthlyData.map(x=>Math.max(x.inc,x.exp)))*100));
    html += `<div class="flow-col"><div class="flow-bars"><i class="in" style="height:${h(d.inc)}%"></i><i class="out" style="height:${h(d.exp)}%"></i></div><span class="m">${d.label}</span></div>`;
  });
  html += `</div></div>`;
  html += `<div class="cols" style="margin-top:12px"><div class="card"><div class="t">Top spending categories (this month)</div>`;
  if (!topCats.length) html += `<div class="empty">No expenses.</div>`;
  topCats.forEach(([id,v]) => { const c=cat(id); html += `<div class="row"><span>${c?c.emoji+' '+esc(c.name):'Uncategorised'}</span><span class="amt">${fmt2(v)}</span></div>`; });
  html += `</div><div class="card"><div class="t">Essential vs discretionary</div>
    <div class="s">Essential ${fmt2(ess)} · Discretionary ${fmt2(disc)}</div>
    <div class="track" style="margin-top:8px"><i style="width:${totalSpent? (ess/totalSpent*100).toFixed(1):0}%;background:var(--jade)"></i></div>
    ${essentialCats.size ? '' : `<div style="font-size:11px;color:var(--muted);margin-top:6px">Mark categories as essential in Settings.</div>`}
  </div></div>`;
  const withIncome = monthlyData.filter(d => d.inc > 0);
  const avgRate = withIncome.length ? withIncome.reduce((s,d) => s + d.rate, 0) / withIncome.length : 0;
  html += `<div class="card" style="margin-top:12px"><div class="t">Averages</div><div class="s">Avg daily spending this month: ${fmt2(avgDaily)} · Avg monthly savings rate: ${avgRate.toFixed(1)}%</div></div>`;
  return html;
}
function forecastView(){
  const today = new Date();
  const days = [30,60,90];
  const daysSpan = 90;
  // average daily net over the last 90 days
  const since = new Date(today.getTime()-daysSpan*86400000);
  const histTx = S.tx.filter(t => new Date(t.date + 'T00:00') >= since);
  const avgDailyExp = histTx.filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0)/daysSpan;
  const avgDailyInc = histTx.filter(t=>t.type==='income').reduce((s,t)=>s+ +t.amount,0)/daysSpan;
  const totalBal = Calc.totalBalance(S.accounts, S.tx);
  const goalMonthly = S.goals.reduce((s,g) => s + Calc.goalProgress(g, today).required, 0);
  let html = `<div class="sec" style="margin-top:4px"><h2>Cash-flow forecast</h2></div>`;
  html += `<div class="card"><div class="t">Assumptions</div><div class="s">Based on current balances, ${daysSpan}-day average daily income ${fmt2(avgDailyInc)} and spending ${fmt2(avgDailyExp)}, plus savings goals. Recurring items are already part of that average, so they are counted once.</div></div>`;
  days.forEach(d => {
    const final = Calc.forecast({total:totalBal, avgDailyIncome:avgDailyInc, avgDailyExpense:avgDailyExp, days:d, goalMonthly});
    html += `<div class="card" style="margin-top:12px"><div class="card-head"><div><div class="t">Next ${d} days</div><div class="s">Projected balance (actual ${fmt2(totalBal)} now)</div></div><div class="chip ${final>=totalBal?'up':'down'}">${fmt2(final)}</div></div>
      <div class="track"><i style="width:${Math.min(100, Math.max(0, final/Math.max(1,totalBal)*100)).toFixed(1)}%;background:var(--accent)"></i></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:6px">Change ${final>=totalBal?'+':''}${fmt2(final-totalBal)}</div></div>`;
  });
  html += `<div class="card" style="margin-top:12px"><div class="t">Projected vs actual</div><div class="s">Projected balances are estimates from historical averages and known recurring items, each counted once. Actual balances may differ.</div></div>`;
  return html;
}
function networthView(){
  const { assets: totalAssets, liabilities: totalLiab, net } = Calc.netWorth(S.accounts, S.tx, S.assets, S.liabilities, S.loans);
  const creditCards = S.accounts.filter(a=>a.type==='credit');
  const creditOutstanding = creditCards.reduce((s,a)=> s + Math.max(0, -bal(a)), 0);

  html += `<div class="hero" style="padding:20px"><div class="lbl">Net worth</div><div class="bal" style="font-size:36px">${fmt(net)}</div><div class="s" style="color:var(--muted)">Assets ${fmt2(totalAssets)} · Liabilities ${fmt2(totalLiab)}</div></div>`;
  // accounts
  html += `<div class="card"><div class="t">Accounts</div>` + S.accounts.map(a => `<div class="row"><span>${esc(a.name)} (${esc(a.type||'bank')})</span><span class="amt">${fmt2(bal(a))}</span></div>`).join('') + `</div>`;

  // liabilities

    html += `<div class="card flat"><div class="row"><span>${esc(l.name)}</span><span class="amt down">${fmt2(l.remaining)}</span></div>
      <div class="s" style="padding:0 0 8px 0">Principal ${fmt2(l.principal)} · Rate ${l.rate}% · EMI ${fmt2(l.emi)} · Remaining ${fmt2(l.remaining)}</div></div>`;
  });
  html += `</div>`;
  // credit cards
  if (creditCards.length) {
    html += `<div class="card" style="margin-top:12px"><div class="t">Credit cards</div>`;
    creditCards.forEach(a => { html += `<div class="row"><span>${esc(a.name)}</span><span class="amt down">Outstanding ${fmt2(Math.max(0,-bal(a)))}</span></div>`; });
    html += `<div class="s">Total outstanding ${fmt2(creditOutstanding)}</div></div>`;
  }
  // reconciliation
  html += `<div class="card" style="margin-top:12px"><div class="t">Reconciliation</div><div class="s">Compare recorded balance with actual. Use account log.</div>`;
  S.accounts.forEach(a => {
    html += `<div class="row"><span>${esc(a.name)}</span><span class="amt">Recorded ${fmt2(bal(a))}</span><button class="btn" data-recon="${a.id}">Reconcile</button></div>`;
  });
  html += `</div>`;
  return html;

function calendarView(){
  const today = todayStr();
  const events = [];
  S.tx.forEach(t => events.push({date:t.date, label: (t.type==='income'?'Income':t.type==='expense'?'Expense':'Transfer') + ' ' + fmt2(t.amount), type:t.type}));
  S.recurring.forEach(r => { if (r.nextDate) events.push({date:r.nextDate, label:'Recurring: '+(r.name||r.note), type:'recurring'}); });
  S.goals.forEach(g => { if (g.targetDate) events.push({date:g.targetDate, label:'Goal deadline: '+g.name, type:'goal'}); });
  S.reminders.forEach(r => events.push({date:r.date, label:r.title, type:'reminder'}));
  // budget reset dates: first of month
  events.sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming = events.filter(e => e.date >= today).slice(0,40);
  let html = `<div class="sec" style="margin-top:4px"><h2>Financial calendar</h2><button class="btn" data-newreminder>+ Reminder</button></div>`;
  html += `<div class="card flat">`;
  if (!upcoming.length) html += `<div class="empty">No upcoming events.</div>`;
  let lastDate = '';
  upcoming.forEach(e => {
    if (e.date !== lastDate) { html += `<div style="padding:8px 0 4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)">${e.date}</div>`; lastDate=e.date; }
    const color = e.type==='income'?'var(--up)':e.type==='expense'?'var(--down)':e.type==='recurring'?'var(--move)':e.type==='goal'?'var(--gold)':'var(--muted)';
    html += `<div class="row"><span style="color:${color}">${esc(e.label)}</span></div>`;
  });
  html += `</div>`;
  // reminders list
  html += `<div class="card" style="margin-top:12px"><div class="t">Reminders</div>`;
  if (!S.reminders.length) html += `<div class="empty">No reminders.</div>`;
  S.reminders.forEach(r => html += `<div class="row"><span>${esc(r.title)} · ${r.date}</span><button class="x" data-delrem="${r.id}">✕</button></div>`);
  html += `</div>`;
  return html;
}
function settingsView(){
  let html = `<div class="sec" style="margin-top:4px"><h2>Settings & personalization</h2></div>`;

function downloadFile(name, content, type){

function triggerImport(kind){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = kind === 'json' ? 'application/json,.json' : 'text/csv,.csv';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => handleImportFile(kind, f.name, r.result); r.readAsText(f); };
  inp.click();
}
function handleImportFile(kind, name, text){
  if (kind === 'json') { importJSON(text, name); return; }
  importCSV(text, name);
}
function importJSON(text, name){
  let parsed;
  try { parsed = JSON.parse(text); } catch(e) { alert('Invalid JSON: ' + e.message); return; }
  const data = parsed.data || parsed;
  if (!data || !Array.isArray(data.accounts) || !Array.isArray(data.cats) || !Array.isArray(data.tx)) {
    alert('Invalid backup: missing accounts/categories/transactions.'); return;
  }
  const counts = `Accounts: ${data.accounts.length}, Categories: ${data.cats.length}, Transactions: ${data.tx.length}`;
  const ok = confirm(`Import backup "${name}"?\n\n${counts}\n\nThis will MERGE into your current data (by id). Cancel to abort.`);
  if (!ok) return;
  const accIds = new Set(S.accounts.map(a=>a.id));
  const catIds = new Set(S.cats.map(c=>c.id));
  const txIds = new Set(S.tx.map(t=>t.id));
  data.accounts.forEach(a=>{ if(a&&a.id&&!accIds.has(a.id)){ S.accounts.push(Object.assign({},a)); accIds.add(a.id);} });
  data.cats.forEach(c=>{ if(c&&c.id&&!catIds.has(c.id)){ S.cats.push(Object.assign({},c)); catIds.add(c.id);} });
  data.tx.forEach(t=>{ if(t&&t.id&&!txIds.has(t.id)){ S.tx.push(Object.assign({},t)); txIds.add(t.id);} });
  if (data.prefs) S.prefs = Object.assign({}, S.prefs, data.prefs);
  save(); render();
  alert('Import complete.');
}
function importCSV(text, name){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) { alert('CSV has no data rows.'); return; }
  const header = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim().toLowerCase());
  // map columns
  const idx = (names) => { for (const n of names) { const i = header.findIndex(h => h.includes(n)); if (i >= 0) return i; } return -1; };
  const di = idx(['date']);
  const desc = idx(['description','desc','narration','particulars','details']);
  const debit = idx(['debit','withdrawal','dr']);
  const credit = idx(['credit','deposit','cr']);
  const amt = idx(['amount']);
  const bal = idx(['balance']);
  if (di < 0) { alert('Could not find a Date column. Please include a header row.'); return; }
  let added = 0, skipped = 0, errors = [];
  const existing = new Set(S.tx.map(t => t.date + '|' + t.amount + '|' + (t.note||'')));
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.length === 0) continue;
    const date = normalizeDate(cols[di] || '');
    if (!date) { errors.push(`Row ${i+1}: invalid date`); continue; }
    let amount = 0, type = 'expense';
    if (debit >= 0 && credit >= 0) {
      const d = parseNum(cols[debit]); const c = parseNum(cols[credit]);
      if (c > 0) { amount = c; type = 'income'; }
      else if (d > 0) { amount = d; type = 'expense'; }
      else { skipped++; continue; }
    } else if (amt >= 0) {
      amount = Math.abs(parseNum(cols[amt]));
      type = parseNum(cols[amt]) >= 0 ? 'income' : 'expense';
    } else { errors.push(`Row ${i+1}: no amount column`); continue; }
    if (!(amount > 0)) { skipped++; continue; }
    const note = desc >= 0 ? (cols[desc] || '').trim() : '';
    const key = date + '|' + amount + '|' + note;
    if (existing.has(key)) { skipped++; continue; }
    const accId = S.accounts.length ? S.accounts[0].id : null;
    if (!accId) { errors.push('No account to import into.'); break; }
    S.tx.push({id:uid(), type, amount, date, acc:accId, cat:'', note: note || 'Imported from ' + name});
    existing.add(key); added++;
  }
  save(); render();
  alert(`CSV import complete.\nAdded: ${added}\nSkipped (duplicates/empty): ${skipped}\nErrors: ${errors.length}` + (errors.length ? '\n' + errors.slice(0,10).join('\n') : ''));
}
function parseCSVLine(line){
  const out = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) { if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') inQ = false; else cur += ch; }
    else { if (ch === '"') inQ = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; }
  }
  out.push(cur); return out;
}
function parseNum(s){ const n = parseFloat(String(s||'').replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; }
function normalizeDate(s){
  s = String(s||'').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) { let [_,d,mo,y] = m; if (y.length === 2) y = '20' + y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  const dt = new Date(s); if (!isNaN(dt)) return new Date(dt - dt.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  return '';
}

  if (!(amt > 0)) { $('#err').textContent = 'Enter amount.'; return; }

    // money leaves account -> expense
    S.tx.push({id:uid(), type:'expense', amount:amt, date:todayStr(), acc:accId, cat:'', note:'Savings: '+g.name});

  save(); close(); render();
}

  const err=m=>{$('#err').textContent=m;};
  const amt=+$('#r-amt').value; if(!(amt>0)) return err('Enter amount.');
  const start=$('#r-start').value||todayStr();
  const r={id:uid(), type:$('#r-type').value, amount:amt, acc:$('#r-acc').value, cat:'', note:$('#r-note').value, freq:$('#r-freq').value, interval:1, startDate:start, endDate:$('#r-end').value||null, nextDate:start, active:true, sub:!!$('#r-sub').checked, name:$('#r-name').value};
  S.recurring.push(r); save(); close(); render();
}
function assetModal(){ open(`<h3>New asset <span class="esc">esc to close</span></h3>
  <div class="f"><label>Name</label><input id="a-name" type="text"></div>
  <div class="f"><label>Value (₹)</label><input id="a-val" type="number" min="0" step="0.01"></div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-saveasset>Save</button></div>`); }
function saveAsset(){ const name=$('#a-name').value.trim(); const val=+$('#a-val').value; if(!name) return $('#err').textContent='Name required.'; if(!(val>=0)) return $('#err').textContent='Value required.'; S.assets.push({id:uid(),name,value:val}); save(); close(); render(); }
function liabModal(){ open(`<h3>New liability <span class="esc">esc to close</span></h3>
  <div class="f"><label>Name</label><input id="l-name" type="text"></div>
  <div class="f"><label>Value (₹)</label><input id="l-val" type="number" min="0" step="0.01"></div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-saveliab>Save</button></div>`); }
function saveLiab(){ const name=$('#l-name').value.trim(); const val=+$('#l-val').value; if(!name) return $('#err').textContent='Name required.'; S.liabilities.push({id:uid(),name,value:val}); save(); close(); render(); }
function loanModal(){ open(`<h3>New loan <span class="esc">esc to close</span></h3>
  <div class="f"><label>Name</label><input id="ln-name" type="text"></div>
  <div class="two"><div class="f"><label>Principal (₹)</label><input id="ln-prin" type="number" min="0" step="0.01"></div><div class="f"><label>Interest rate %</label><input id="ln-rate" type="number" min="0" step="0.01"></div></div>
  <div class="two"><div class="f"><label>EMI (₹)</label><input id="ln-emi" type="number" min="0" step="0.01"></div><div class="f"><label>Remaining (₹)</label><input id="ln-rem" type="number" min="0" step="0.01"></div></div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-saveloan>Save</button></div>`); }
function saveLoan(){ const name=$('#ln-name').value.trim(); if(!name) return $('#err').textContent='Name required.'; S.loans.push({id:uid(),name,principal:+$('#ln-prin').value||0,rate:+$('#ln-rate').value||0,emi:+$('#ln-emi').value||0,remaining:+$('#ln-rem').value||0}); save(); close(); render(); }
function reminderModal(){ open(`<h3>New reminder <span class="esc">esc to close</span></h3>
  <div class="f"><label>Title</label><input id="rem-title" type="text"></div>
  <div class="f"><label>Date</label><input id="rem-date" type="date" value="${todayStr()}"></div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-savereminder>Save</button></div>`); }
function saveReminder(){ const title=$('#rem-title').value.trim(); if(!title) return $('#err').textContent='Title required.'; S.reminders.push({id:uid(),title,date:$('#rem-date').value||todayStr()}); save(); close(); render(); }
function reconModal(id){
  const a = S.accounts.find(x=>x.id===id); if(!a) return;
  open(`<h3>Reconcile ${esc(a.name)} <span class="esc">esc to close</span></h3>
  <div class="f"><label>Recorded balance</label><input value="${bal(a).toFixed(2)}" disabled></div>
  <div class="f"><label>Actual balance (₹)</label><input id="recon-actual" type="number" step="0.01"></div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-saverecon="${id}">Save adjustment</button></div>`);
}
function saveRecon(id){
  const a = S.accounts.find(x=>x.id===id); if(!a) return;
  const actual = +$('#recon-actual').value;
  const recorded = bal(a);
  const diff = actual - recorded;
  if (diff === 0) { close(); return; }
  S.tx.push({id:uid(), type: diff>0?'income':'expense', amount:Math.abs(diff), date:todayStr(), acc:id, cat:'', note:'Reconciliation adjustment'});
  save(); close(); render();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button, #modal');
  if (!b) return;
  const d = b.dataset;
  if (b.id === 'modal') { if (e.target === b) close(); return; }
  if (b.id === 'fab') { ttype = 'expense'; return txModal(); }
  if (b.id === 'theme') { S.prefs.theme = S.prefs.theme === 'light' ? 'dark' : 'light'; save(); applyPrefs(); return; }
  if (d.accent) { S.prefs.accent = d.accent; save(); applyPrefs(); return; }
  const emptyF = () => ({acc:'', cat:'', type:'', q:'', from:'', to:'', month:'', sort:'newest'});
  if (d.v) { view = d.v; armed = null; if (d.v !== 'tx') F = emptyF(); return render(); }
  if (d.log) { F = Object.assign(emptyF(), {acc:d.log}); view = 'tx'; armed = null; return render(); }
  if (d.clog) { F = Object.assign(emptyF(), {cat:d.clog}); view = 'tx'; armed = null; return render(); }
  if (d.new) return d.new === 'acc' ? accModal() : catModal();
  if ('close' in d) return close();
  if (d.t) { ttype = d.t; return txModal(); }
  if (d.c) { pick = d.c; document.querySelectorAll('.sw button[data-c]').forEach(x => x.classList.toggle('on', x.dataset.c === pick)); return; }
  if ('dismissNote' in d) { S.prefs.importedSeen = true; save(); render(); return; }
  if (d.save) return saveForm(d.save);
  if (d.savebudget) return saveBudget();
  if (d.savegoal) return saveGoal();
  if (d.savecontrib) return saveContrib(d.savecontrib);
  if (d.saverec) return saveRec();
  if (d.saveasset) return saveAsset();
  if (d.saveliab) return saveLiab();
  if (d.saveloan) return saveLoan();
  if (d.savereminder) return saveReminder();
  if (d.saverecon) return saveRecon(d.saverecon);
  if (d.edit) { return openEditTx(d.edit); }
  if (d.dup) { return duplicateTx(d.dup); }
  if (d.exportcsv) { return exportCSV(); }
  if (d.backup) { return backupJSON(); }
  if (d.importjson) { return triggerImport('json'); }
  if (d.importcsv) { return triggerImport('csv'); }
  if (d.undo) { return undoDelete(); }
  if (d.newbudget) { return budgetModal(); }
  if (d.newbudgetcat) { return budgetModal(d.newbudgetcat); }
  if (d.copybudget) { return copyBudget(); }
  if (d.newgoal) { return goalModal(); }
  if (d.contrib) { return contribModal(d.contrib, 'in'); }
  if (d.withdraw) { return contribModal(d.withdraw, 'out'); }
  if (d.delgoal) { S.goals = S.goals.filter(g => g.id !== d.delgoal); save(); render(); return; }
  if (d.newrec) { return recModal(); }
  if (d.delrec) { S.recurring = S.recurring.filter(r => r.id !== d.delrec); save(); render(); return; }
  if (d.newasset) { return assetModal(); }
  if (d.newliab) { return liabModal(); }
  if (d.newloan) { return loanModal(); }
  if (d.delasset) { S.assets = S.assets.filter(a => a.id !== d.delasset); save(); render(); return; }
  if (d.delliab) { S.liabilities = S.liabilities.filter(l => l.id !== d.delliab); save(); render(); return; }
  if (d.newreminder) { return reminderModal(); }
  if (d.delrem) { S.reminders = S.reminders.filter(r => r.id !== d.delrem); save(); render(); return; }
  if (d.recon) { return reconModal(d.recon); }
  if (d.del) {
    if (armed !== d.del) { armed = d.del; return render(); }
    const k = d.del[0], id = d.del.slice(1);
    if (k === 't') { const t = S.tx.find(x => x.id === id); if (t) { lastDeleted = {tx:t, idx:S.tx.indexOf(t)}; if (undoTimer) clearTimeout(undoTimer); undoTimer = setTimeout(()=>{lastDeleted=null; render();}, 6000); } S.tx = S.tx.filter(t => t.id !== id); }
    if (k === 'a') { S.accounts = S.accounts.filter(a => a.id !== id); S.tx = S.tx.filter(t => t.acc !== id && t.to !== id); }
    if (k === 'c') { S.cats = S.cats.filter(c => c.id !== id); S.tx.forEach(t => { if (t.cat === id) t.cat = ''; }); }
    armed = null; save(); render();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.f) { F[e.target.dataset.f] = e.target.value; render(); }
  if (e.target.dataset.setting) {
    const k = e.target.dataset.setting; const v = e.target.value;
    if (k === 'theme') S.prefs.theme = v;
    else if (k === 'accent') S.prefs.accent = v;
    else if (k === 'currency') S.prefs.currency = v;
    else if (k === 'symbol') S.prefs.symbol = v;
    else if (k === 'locale') S.prefs.locale = v;
    save(); applyPrefs(); render();
  }
  if (e.target.dataset.essential) {
    const c = S.cats.find(x => x.id === e.target.dataset.essential);
    if (c) { c.essential = e.target.checked; save(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.f === 'q') {
    F.q = e.target.value;
    render();
    // render() rebuilds the view, so put the caret back where the typing was
    const q = document.querySelector('[data-f="q"]');
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  if (e.key === 'Enter' && $('#modal').classList.contains('open')) {
    const s = document.querySelector('#modal [data-save], #modal [data-savebudget], #modal [data-savegoal], #modal [data-savecontrib], #modal [data-saverec], #modal [data-saveasset], #modal [data-saveliab], #modal [data-saveloan], #modal [data-savereminder], #modal [data-saverecon]');
    if (s) {
      const a = s.dataset; 
      if (a.save) saveForm(a.save);
      else if (a.savebudget) saveBudget();
      else if (a.savegoal) saveGoal();
      else if (a.savecontrib) saveContrib(a.savecontrib);
      else if (a.saverec) saveRec();
      else if (a.saveasset) saveAsset();
      else if (a.saveliab) saveLiab();
      else if (a.saveloan) saveLoan();
      else if (a.savereminder) saveReminder();
      else if (a.saverecon) saveRecon(a.saverecon);
    }
  }
  if (!e.ctrlKey && !e.metaKey && e.key === 'n' && !$('#modal').classList.contains('open')) { ttype='expense'; txModal(); }
  if (e.key === '/' && !$('#modal').classList.contains('open')) { const q = document.querySelector('[data-f="q"]'); if (q) { e.preventDefault(); q.focus(); } }
});

applyPrefs();
const verEl = $('#version');
if (verEl) verEl.innerHTML = `WiseSpend <b>v${esc(VERSION)}</b>`;

/* the Sable 1.x store, staged by main.js and handed over by preload.js */
if (window.wisespendLegacy) {
  try {
    // null means the staged store was unusable, so main.js keeps the check open
    const added = adoptLegacyStore(window.wisespendLegacy);
    if (added !== null && window.wisespendLegacyAdopted) window.wisespendLegacyAdopted();
  } catch (e) { console.error('WiseSpend: legacy import failed', e); }
}

render();
</script>
</body>
</html>
