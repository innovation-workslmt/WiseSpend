<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sable — Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#08080A;
  --panel:#101013;
  --panel-2:#16161A;
  --line:#232329;
  --line-soft:#1B1B20;
  --ink:#F0F0F2;
  --mute:#8B8B95;
  --dim:#5D5D67;
  --accent:#E8D3A9;
  --accent-ink:#0A0A0B;
  --accent-soft:rgba(232,211,169,.10);
  --up:#6EDCB0;
  --down:#F2788F;
  --radius:18px;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#F3F2EE;
  --panel:#FFFFFF;
  --panel-2:#FAF9F6;
  --line:#E2E0DA;
  --line-soft:#EDEBE5;
  --ink:#141418;
  --mute:#6E6E76;
  --dim:#9A9A9F;
  --accent-soft:rgba(160,130,70,.12);
  --up:#1F8E63;
  --down:#C1405C;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.55 Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 78% -12%,var(--accent-soft),transparent 62%),
             radial-gradient(700px 460px at -10% 100%,rgba(110,220,176,.045),transparent 65%);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;
  padding:24px 16px 20px;border-right:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 55%);
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{
  width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font:600 13px/1 Inter,sans-serif;letter-spacing:-.02em;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 6px 18px -8px var(--accent);
}
.brand b{font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.brand span{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:-6px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;
  color:var(--mute);font-size:13.5px;transition:background .16s,color .16s;
}
.nav button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.045);color:var(--ink)}
.nav button.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav button.on svg{color:var(--accent);opacity:1}
.nav .count{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:0 6px}
.foot-block{display:flex;flex-direction:column;gap:7px}
.foot-block .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.sw{display:flex;gap:7px}
.sw button{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;transition:transform .16s,box-shadow .16s}
.sw button:hover{transform:translateY(-1px)}
.sw button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.ghost{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:8px 10px;border:1px solid var(--line);border-radius:10px;color:var(--mute);font-size:12px;
  transition:border-color .16s,color .16s;
}
.ghost:hover{color:var(--ink);border-color:var(--dim)}
.ghost svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.currency{font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

main{min-width:0;width:100%;max-width:1120px;margin:0 auto;padding:30px 38px 100px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.top h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.top .sub{margin-top:4px;font-size:12px;color:var(--dim)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;
  transition:background .16s,border-color .16s,transform .16s;
}
.btn:hover{background:var(--panel-2);border-color:var(--dim)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600;box-shadow:0 10px 26px -18px var(--accent)}
.btn.pri:hover{filter:brightness(1.05);transform:translateY(-1px)}

/* ---------- cards ---------- */
.hero{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;
  padding:28px 30px 26px;margin-bottom:16px;
  background:var(--panel);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(560px 220px at 8% -20%,var(--accent-soft),transparent 70%);
}
.hero .lbl{position:relative;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.hero .bal{
  position:relative;margin:8px 0 22px;
  font-family:"Instrument Serif",Georgia,"Times New Roman",serif;
  font-size:56px;line-height:1.02;letter-spacing:-.015em;font-variant-numeric:tabular-nums;
}
.hero .bal em{font-style:normal;font-size:.52em;color:var(--mute);margin-right:6px;letter-spacing:0}
.kpis{position:relative;display:flex;flex-wrap:wrap;gap:12px 40px;padding-top:18px;border-top:1px solid var(--line-soft)}
.kpi .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kpi .v{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}

.grid{display:grid;gap:12px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.panel.tight{padding:8px 20px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 12px}
.sec h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sec .link{font-size:12px;color:var(--dim);border-bottom:1px solid transparent;transition:color .16s,border-color .16s}
.sec .link:hover{color:var(--ink);border-color:var(--line)}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;align-items:start}

/* ---------- accounts ---------- */
.acct{
  position:relative;overflow:hidden;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;background:var(--panel);
  transition:border-color .18s,transform .18s,background .18s;
}
.acct:hover{border-color:var(--dim);transform:translateY(-2px)}
.acct .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.acct .bank{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.acct .name{font-size:14px;font-weight:500;margin:2px 0 20px}
.acct .amt{font-family:"Instrument Serif",Georgia,serif;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.acct::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(180px 120px at 100% 0%,var(--glow,rgba(255,255,255,.05)),transparent 70%)}
.acct-wrap{display:flex;flex-direction:column;gap:6px}
.mini{font-size:11.5px;color:var(--dim);padding:4px 2px;align-self:flex-start;transition:color .16s}
.mini:hover{color:var(--ink)}
.mini.sure{color:var(--down)}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.dot{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-size:15px;background:var(--panel-2);border:1px solid var(--line-soft);
}
.row .t{flex:1;min-width:0}
.row .t .a{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .b{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{color:var(--dim);font-size:11px;padding:5px 7px;border-radius:7px;transition:color .16s,background .16s}
.x:hover{color:var(--ink);background:var(--panel-2)}
.x.sure{color:var(--down);background:rgba(242,120,143,.12)}
.empty{padding:26px 4px;text-align:center;color:var(--dim);font-size:12.5px}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:14px}
.barrow .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.barrow .head .n{font-size:13px}
.barrow .head .v{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.track{height:5px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .35s ease}

/* ---------- filters / inputs ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,input[type=text],input[type=number],input[type=date]{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:13px;
  transition:border-color .16s,background .16s;
}
select:hover,input:hover{border-color:var(--dim)}
input::placeholder{color:var(--dim)}
.filters select{width:auto;flex:1;min-width:130px;padding:8px 10px;font-size:12.5px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,4,6,.62);backdrop-filter:blur(7px)}
#modal.open{display:flex}
.sheet{
  width:100%;max-width:470px;max-height:90vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;
  box-shadow:0 40px 90px -40px #000;
}
.sheet h3{margin:0 0 18px;font-size:15px;font-weight:600;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:center}
.sheet h3 .esc{color:var(--dim);font-size:12px;font-weight:400}
.f{margin-bottom:13px}
.f label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:7px;border-radius:9px;font-size:12.5px;color:var(--mute);transition:background .16s,color .16s}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btns{display:flex;gap:9px;margin-top:20px}
.btns button{flex:1;padding:11px;border-radius:11px;font-size:13px;font-weight:500;background:var(--panel-2);border:1px solid var(--line)}
.btns .pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.err{color:var(--down);font-size:12px;min-height:16px;margin-top:2px}

@media (max-width:900px){
  .cols{grid-template-columns:1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line-soft);overflow-x:auto;background:none}
  .brand b, .brand span{display:none}
  .nav{flex-direction:row;margin:0;gap:2px}
  .nav button{padding:7px 11px;white-space:nowrap}
  .nav .count{display:none}
  .rail-foot{flex-direction:row;margin:0 0 0 auto;gap:10px;padding:0}
  .foot-block:first-child{display:none}
  .foot-block .k{display:none}
  main{padding:20px 16px 96px}
  .hero{padding:22px}
  .hero .bal{font-size:40px}
  .top{margin-bottom:22px}
  .top .sub{display:none}
}
@media (max-width:560px){
  .sheet{border-radius:20px;padding:20px}
  .filters select{min-width:0;flex:1 1 44%}
  .btn.pri span{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">S</div>
      <div><b>Sable</b><span>Finance</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="foot-block">
        <div class="k">Accent</div>
        <div class="sw" id="sw"></div>
      </div>
      <div class="foot-block">
        <button class="ghost" id="theme">
          <span id="themeLabel">Dark</span>
          <svg viewBox="0 0 24 24"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1 1M18.8 18.8l1 1M3 12h1.5M19.5 12H21M4.2 19.8l1-1M18.8 5.2l1-1"/><circle cx="12" cy="12" r="3.6"/></svg>
        </button>
        <div class="currency">INR · ₹</div>
      </div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div>
        <h1 id="title">Overview</h1>
        <div class="sub" id="today"></div>
      </div>
      <button class="btn pri" id="fab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New transaction</span>
      </button>
    </div>
    <div id="app"></div>
  </main>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- data ---------- */
const P = ['#E8D3A9','#7EE7B8','#9B8CFF','#F2788F','#8FC7FF','#FFB27A'];
const ACCENTS = {
  champagne:{a:'#E8D3A9', ink:'#0A0A0B'},
  jade:{a:'#7EE7B8', ink:'#05130D'},
  iris:{a:'#9B8CFF', ink:'#0A0716'}
};
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (n, d) => new Intl.NumberFormat('en-IN',{maximumFractionDigits:d}).format(Math.abs(n || 0));
const sgn = n => (n || 0) < 0 ? '−' : '';
const fmt  = n => `${sgn(n)}₹${num(n, 2)}`;
const fmt2 = n => `${sgn(n)}₹${num(n, 0)}`;
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fdate = d => new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const seed = () => ({
  accounts:[{id:'a1',name:'Cash',bank:'Wallet',open:0,color:P[1]}],
  cats:[['Food','🍜','expense',P[5]],['Transport','🚌','expense',P[4]],['Rent','🏠','expense',P[0]],['Shopping','🛍️','expense',P[3]],['Salary','💼','income',P[1]],['Freelance','✨','income',P[2]]].map(c=>({id:uid(),name:c[0],emoji:c[1],type:c[2],color:c[3]})),
  tx:[],
  prefs:{theme:'dark',accent:'champagne'}
});

let S;
try { S = JSON.parse(localStorage.getItem('sable-v1')); } catch(e) {}
S = S || seed();
S.prefs = Object.assign({theme:'dark',accent:'champagne'}, S.prefs || {});
const save = () => { try { localStorage.setItem('sable-v1', JSON.stringify(S)); } catch(e) {} };

let view = 'home', F = {acc:'', cat:'', type:''}, armed = null, pick = P[0], ttype = 'expense';

const acc = id => S.accounts.find(a => a.id === id);
const cat = id => S.cats.find(c => c.id === id);
const bal = a => S.tx.reduce((b,t) => {
  const v = +t.amount;
  if (t.type === 'income'  && t.acc === a.id) return b + v;
  if (t.type === 'expense' && t.acc === a.id) return b - v;
  if (t.type === 'transfer') { if (t.acc === a.id) b -= v; if (t.to === a.id) b += v; }
  return b;
}, +a.open);
const sorted = l => [...l].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
const tint = (hex, alpha) => {
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(x=>x+x).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
};

/* ---------- icons ---------- */
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.6 10.4V20h10.8v-9.6"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  wallet:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><path d="M16.5 15h1.5"/></svg>',
  tag:'<svg viewBox="0 0 24 24"><path d="M4 12.4V5.2A1.2 1.2 0 0 1 5.2 4h7.2l7.6 7.6-8.4 8.4L4 12.4Z"/><circle cx="8.4" cy="8.4" r="1.3"/></svg>'
};

/* ---------- prefs ---------- */
function applyPrefs(){
  const p = S.prefs;
  document.documentElement.dataset.theme = p.theme === 'light' ? 'light' : 'dark';
  const a = ACCENTS[p.accent] || ACCENTS.champagne;
  document.documentElement.style.setProperty('--accent', a.a);
  document.documentElement.style.setProperty('--accent-ink', a.ink);
  const tl = $('#themeLabel'); if (tl) tl.textContent = p.theme === 'light' ? 'Light' : 'Dark';
  const sw = $('#sw');
  if (sw) sw.innerHTML = Object.entries(ACCENTS).map(([k,v]) =>
    `<button data-accent="${k}" class="${p.accent===k?'on':''}" style="background:${v.a}" aria-label="${k} accent"></button>`).join('');
}

/* ---------- rows ---------- */
function txRow(t){
  const c = cat(t.cat), a = acc(t.acc), to = acc(t.to);
  const title = t.type === 'transfer' ? 'Transfer' : (c ? c.name : 'Uncategorised');
  const where = t.type === 'transfer' ? `${esc(a?.name || '—')} → ${esc(to?.name || '—')}` : esc(a?.name || '—');
  const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '';
  const cls = t.type === 'income' ? 'up' : t.type === 'expense' ? 'down' : '';
  const tintColor = t.type === 'transfer' ? P[2] : (c?.color || '#8B8B95');
  const glyph = t.type === 'transfer' ? '⇄' : (c?.emoji || '•');
  return `<div class="row">
    <div class="dot" style="background:${tint(tintColor,.13)};border-color:${tint(tintColor,.22)};color:${tintColor}">${glyph}</div>
    <div class="t"><div class="a">${esc(title)}${t.note?' <span style="color:var(--dim)">· '+esc(t.note)+'</span>':''}</div>
      <div class="b">${where} · ${fdate(t.date)}</div></div>
    <div class="amt ${cls}">${sign}${fmt(t.amount)}</div>
    <button class="x ${armed==='t'+t.id?'sure':''}" data-del="t${t.id}" aria-label="Delete transaction">${armed==='t'+t.id?'Sure?':'✕'}</button>
  </div>`;
}

/* ---------- views ---------- */
const TITLES = {home:'Overview', tx:'Transactions', acc:'Accounts', cat:'Categories'};

function render(){
  const d = new Date();
  $('#today').textContent = d.toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long'});
  $('#title').textContent = TITLES[view];
  $('#nav').innerHTML = [['home','Overview','home'],['tx','Transactions','list'],['acc','Accounts','wallet'],['cat','Categories','tag']]
    .map(([v,label,icon]) => `<button data-v="${v}" class="${view===v?'on':''}">${ICON[icon]}<span>${label}</span>${v==='tx'&&S.tx.length?`<span class="count">${S.tx.length}</span>`:''}</button>`).join('');
  $('#app').innerHTML = ({home, tx, acc:accountsView, cat:catsView})[view]();
  applyPrefs();
}

function home(){
  const m = todayStr().slice(0,7);
  const mt = S.tx.filter(t => t.date.startsWith(m));
  const inc = mt.filter(t => t.type === 'income').reduce((s,t) => s + +t.amount, 0);
  const exp = mt.filter(t => t.type === 'expense').reduce((s,t) => s + +t.amount, 0);
  const total = S.accounts.reduce((s,a) => s + bal(a), 0);
  const net = inc - exp;

  const spend = {};
  mt.filter(t => t.type === 'expense').forEach(t => {
    const k = t.cat || '';
    spend[k] = (spend[k] || 0) + +t.amount;
  });
  const bars = Object.entries(spend).sort((a,b) => b[1]-a[1]).slice(0,5).map(([id,v]) => {
    const c = cat(id);
    return {name:c ? `${c.emoji} ${c.name}` : 'Uncategorised', color:c?.color || '#8B8B95', v};
  });
  const maxBar = Math.max(1, ...bars.map(b => b.v));

  return `
  <section class="hero">
    <div class="lbl">Total balance</div>
    <div class="bal">${sgn(total)}<em>₹</em>${num(total, 2)}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">Income · this month</div><div class="v up">+${fmt2(inc)}</div></div>
      <div class="kpi"><div class="k">Spent · this month</div><div class="v down">−${fmt2(exp)}</div></div>
      <div class="kpi"><div class="k">Saved · this month</div><div class="v ${net >= 0 ? 'up' : 'down'}">${net >= 0 ? '+' : '−'}${fmt2(Math.abs(net))}</div></div>
      <div class="kpi"><div class="k">Across</div><div class="v">${S.accounts.length} account${S.accounts.length===1?'':'s'}</div></div>
    </div>
  </section>

  <div class="sec"><h2>Accounts</h2><button class="link" data-v="acc">See all</button></div>
  <div class="grid g-auto">${S.accounts.map(accCard).join('') || '<div class="panel empty">No accounts yet — add one to begin.</div>'}</div>

  <div class="sec"><h2>This month</h2><button class="link" data-v="tx">All transactions</button></div>
  <div class="cols">
    <div class="panel">
      <div class="lbl" style="font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:16px">Spending by category</div>
      ${bars.length ? `<div class="bars">${bars.map(b => `
        <div class="barrow">
          <div class="head"><span class="n">${esc(b.name)}</span><span class="v">${fmt2(b.v)}</span></div>
          <div class="track"><i style="width:${Math.max(3,(b.v/maxBar*100)).toFixed(1)}%;background:${b.color}"></i></div>
        </div>`).join('')}</div>`
      : '<div class="empty">No expenses logged this month.</div>'}
    </div>
    <div class="panel tight">
      ${S.tx.length ? sorted(S.tx).slice(0,6).map(txRow).join('') : '<div class="empty">Nothing yet. Add your first transaction.</div>'}
    </div>
  </div>`;
}

const accCard = a => `<button class="acct" data-log="${a.id}" style="--glow:${tint(a.color,.14)}">
  <div class="bank"><span class="dot" style="background:${a.color}"></span>${esc(a.bank)}</div>
  <div class="name">${esc(a.name)}</div>
  <div class="amt">${fmt(bal(a))}</div>
</button>`;

function tx(){
  let l = sorted(S.tx).filter(t => (!F.acc || t.acc === F.acc || t.to === F.acc) && (!F.cat || t.cat === F.cat) && (!F.type || t.type === F.type));
  const o = (arr, sel) => arr.map(x => `<option value="${x.id||x[0]}" ${sel===(x.id||x[0])?'selected':''}>${esc(x.name||x[1])}</option>`).join('');
  const sum = l.reduce((s,t) => s + (t.type === 'income' ? +t.amount : t.type === 'expense' ? -+t.amount : 0), 0);
  return `<div class="filters">
    <select data-f="type"><option value="">All types</option>${o([['expense','Expenses'],['income','Income'],['transfer','Transfers']], F.type)}</select>
    <select data-f="acc"><option value="">All accounts</option>${o(S.accounts, F.acc)}</select>
    <select data-f="cat"><option value="">All categories</option>${o(S.cats, F.cat)}</select>
  </div>
  <div class="sec" style="margin:0 0 10px"><h2>${l.length} transaction${l.length===1?'':'s'}</h2>
    <span style="font-size:12px;color:var(--dim)">Net <b style="color:${sum>=0?'var(--up)':'var(--down)'};font-weight:500">${sum>=0?'+':'−'}${fmt2(Math.abs(sum))}</b></span></div>
  <div class="panel tight">${l.length ? l.map(txRow).join('') : '<div class="empty">Nothing matches these filters.</div>'}</div>`;
}

function accountsView(){
  return `<div class="sec" style="margin-top:0"><h2>Your accounts</h2><button class="btn" data-new="acc">+ New account</button></div>
  <div class="grid g-auto">${S.accounts.map(a => `<div class="acct-wrap">${accCard(a)}
    <button class="mini ${armed==='a'+a.id?'sure':''}" data-del="a${a.id}">${armed==='a'+a.id?'Delete account and its transactions?':'Delete'}</button></div>`).join('') || '<div class="panel empty">No accounts yet.</div>'}</div>
  <p style="color:var(--dim);font-size:12px;margin-top:18px;max-width:520px">One account per bank, wallet or card. Open an account to see its full log. Balances include the opening balance and every income, expense and transfer.</p>`;
}

function catsView(){
  const group = type => S.cats.filter(c => c.type === type).map(c => {
    const n = S.tx.filter(x => x.cat === c.id).length;
    return `<div class="row">
      <button class="dot" data-clog="${c.id}" style="background:${tint(c.color,.13)};border-color:${tint(c.color,.22)}">${c.emoji}</button>
      <div class="t"><div class="a">${esc(c.name)}</div><div class="b">${n} transaction${n===1?'':'s'}</div></div>
      <button class="x" data-clog="${c.id}">Log</button>
      <button class="x ${armed==='c'+c.id?'sure':''}" data-del="c${c.id}">${armed==='c'+c.id?'Sure?':'✕'}</button>
    </div>`;
  }).join('') || '<div class="empty">None yet.</div>';
  return `<div class="sec" style="margin-top:0"><h2>Expense categories</h2><button class="btn" data-new="cat">+ New category</button></div>
  <div class="panel tight">${group('expense')}</div>
  <div class="sec"><h2>Income categories</h2></div>
  <div class="panel tight">${group('income')}</div>`;
}

/* ---------- modals ---------- */
const open = h => { $('#sheet').innerHTML = h; $('#modal').classList.add('open'); };
const close = () => $('#modal').classList.remove('open');
const swatches = () => `<div class="sw" style="gap:9px">${P.map(c => `<button data-c="${c}" class="${c===pick?'on':''}" style="width:24px;height:24px;background:${c}" aria-label="colour"></button>`).join('')}</div>`;

function txModal(){
  if (!S.accounts.length) { accModal(); return; }
  const ac = S.accounts.map(a => `<option value="${a.id}">${esc(a.name)} (${esc(a.bank)})</option>`).join('');
  const cs = S.cats.filter(c => c.type === ttype).map(c => `<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('');
  const tr = ttype === 'transfer';
  open(`<h3>New transaction <span class="esc">esc to close</span></h3>
  <div class="seg">${['expense','income','transfer'].map(t => `<button data-t="${t}" class="${t===ttype?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
  <div class="two">
    <div class="f"><label>Amount (₹)</label><input id="m-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autofocus></div>
    <div class="f"><label>Date</label><input id="m-date" type="date" value="${todayStr()}"></div>
  </div>
  <div class="f"><label>${tr?'From account':'Account'}</label><select id="m-acc">${ac}</select></div>
  ${tr ? `<div class="f"><label>To account</label><select id="m-to">${ac}</select></div>`
       : `<div class="f"><label>Category</label><select id="m-cat">${cs || '<option value="">No categories</option>'}</select></div>`}
  <div class="f"><label>Note (optional)</label><input id="m-note" type="text" maxlength="60" placeholder="e.g. Lunch with team"></div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-save="tx">Save</button></div>`);
  if (tr && S.accounts.length > 1) $('#m-to').selectedIndex = 1;
  setTimeout(() => $('#m-amt')?.focus(), 60);
}

function accModal(){
  pick = P[1];
  open(`<h3>New account <span class="esc">esc to close</span></h3>
  <div class="f"><label>Account name</label><input id="m-name" type="text" maxlength="30" placeholder="e.g. Savings"></div>
  <div class="f"><label>Bank or wallet</label><input id="m-bank" type="text" maxlength="30" placeholder="e.g. HDFC Bank"></div>
  <div class="f"><label>Opening balance (₹)</label><input id="m-open" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
  <div class="f"><label>Accent</label>${swatches()}</div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-save="acc">Save account</button></div>`);
}

function catModal(){
  pick = P[0];
  open(`<h3>New category <span class="esc">esc to close</span></h3>
  <div class="two">
    <div class="f"><label>Name</label><input id="m-name" type="text" maxlength="24" placeholder="e.g. Groceries"></div>
    <div class="f"><label>Emoji</label><input id="m-emoji" type="text" maxlength="4" value="🌿"></div>
  </div>
  <div class="f"><label>Type</label><select id="m-type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
  <div class="f"><label>Accent</label>${swatches()}</div>
  <div class="err" id="err"></div>
  <div class="btns"><button data-close>Cancel</button><button class="pri" data-save="cat">Save category</button></div>`);
}

function saveForm(k){
  const v = id => ($('#'+id)?.value || '').trim();
  const err = m => { $('#err').textContent = m; };
  if (k === 'tx'){
    const amt = +v('m-amt');
    if (!(amt > 0)) return err('Enter an amount greater than 0.');
    const t = {id:uid(), type:ttype, amount:amt, date:v('m-date') || todayStr(), acc:v('m-acc'), note:v('m-note')};
    if (ttype === 'transfer') { t.to = v('m-to'); if (t.to === t.acc) return err('Pick two different accounts.'); }
    else t.cat = v('m-cat');
    S.tx.push(t);
  }
  if (k === 'acc'){
    if (!v('m-name')) return err('Give the account a name.');
    S.accounts.push({id:uid(), name:v('m-name'), bank:v('m-bank') || 'Bank', open:+v('m-open') || 0, color:pick});
  }
  if (k === 'cat'){
    if (!v('m-name')) return err('Give the category a name.');
    S.cats.push({id:uid(), name:v('m-name'), emoji:v('m-emoji') || '•', type:v('m-type'), color:pick});
  }
  save(); close(); render();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button, #modal');
  if (!b) return;
  const d = b.dataset;
  if (b.id === 'modal') { if (e.target === b) close(); return; }
  if (b.id === 'fab') { ttype = 'expense'; return txModal(); }
  if (b.id === 'theme') { S.prefs.theme = S.prefs.theme === 'light' ? 'dark' : 'light'; save(); applyPrefs(); return; }
  if (d.accent) { S.prefs.accent = d.accent; save(); applyPrefs(); return; }
  if (d.v) { view = d.v; armed = null; if (d.v !== 'tx') F = {acc:'', cat:'', type:''}; return render(); }
  if (d.log) { F = {acc:d.log, cat:'', type:''}; view = 'tx'; armed = null; return render(); }
  if (d.clog) { F = {acc:'', cat:d.clog, type:''}; view = 'tx'; armed = null; return render(); }
  if (d.new) return d.new === 'acc' ? accModal() : catModal();
  if ('close' in d) return close();
  if (d.t) { ttype = d.t; return txModal(); }
  if (d.c) { pick = d.c; document.querySelectorAll('.sw button[data-c]').forEach(x => x.classList.toggle('on', x.dataset.c === pick)); return; }
  if (d.save) return saveForm(d.save);
  if (d.del) {
    if (armed !== d.del) { armed = d.del; return render(); }
    const k = d.del[0], id = d.del.slice(1);
    if (k === 't') S.tx = S.tx.filter(t => t.id !== id);
    if (k === 'a') { S.accounts = S.accounts.filter(a => a.id !== id); S.tx = S.tx.filter(t => t.acc !== id && t.to !== id); }
    if (k === 'c') { S.cats = S.cats.filter(c => c.id !== id); S.tx.forEach(t => { if (t.cat === id) t.cat = ''; }); }
    armed = null; save(); render();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.f) { F[e.target.dataset.f] = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  if (e.key === 'Enter' && $('#modal').classList.contains('open')) {
    const save = document.querySelector('#modal [data-save]');
    if (save) saveForm(save.dataset.save);
  }
});

applyPrefs();
render();
</script>
</body>
</html>
